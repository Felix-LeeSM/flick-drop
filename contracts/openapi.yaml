openapi: 3.1.0
info:
  title: Flick API
  version: 0.1.0
  description: HTTP contract for Flick web clients.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealthz
      responses:
        "200":
          description: API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadyz
      responses:
        "200":
          description: API dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API dependency is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics for scraping
      description: >
        Requires the FLICK_METRICS_TOKEN bearer token, a credential separate
        from the internal token. An unset configured token fails closed with 401.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: unauthorized for a missing or invalid metrics token, or when no metrics token is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/config:
    get:
      operationId: getConfig
      summary: Public client-facing size limits.
      description: >
        Lets the browser size-gate file uploads and route large files to the S3
        path. Values are advisory — the server re-enforces both limits, so a
        tampered client value cannot bypass them. TTL bounds are not exposed
        here (they travel to the client at build time).
      responses:
        "200":
          description: Client-facing limits.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
  /api/secrets:
    post:
      operationId: createSecret
      summary: Create an encrypted secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          description: Secret created; the independent management token is returned only here.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSecretResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: rate_limited. Per client network (IPv4 address or IPv6 /64) by FLICK_CREATE_RATE_PER_MIN.
          headers:
            Retry-After:
              schema: {type: string, const: "60"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: storage_full when a large-file reservation fits under no object storage backend's total-size ceiling. Nothing is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}:
    get:
      operationId: getSecretMetadata
      summary: Fetch safe metadata needed to derive an access proof.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Metadata found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSecretMetadataResponse"
        "404":
          description: >
            not_found for an unknown ID and for an opened secret: the open
            deletes every record of the ID, so the two responses are identical.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Secret locked by invalid access proofs (consumed) or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}/management:
    get:
      operationId: getManagementStatus
      summary: Read delivery status using its independent management capability.
      description: >
        Valid only before the original expiry. A successful open deletes the
        management record with the secret, so an opened delivery returns the
        same 404 management_unavailable response as an unknown ID. This read
        never consumes the delivery. Cancellation is not implemented by this
        endpoint.
      security:
        - managementToken: []
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Authenticated status snapshot.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementStatusResponse"
        "404":
          description: >
            management_unavailable for missing, invalid, mismatched, or expired
            capabilities and for opened deliveries; byte-identical in every case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Management rate limit exceeded; recipient attempts are unaffected.
        "503":
          description: Status temporarily unavailable; no terminal outcome is implied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}/revoke:
    post:
      operationId: revokeSecret
      summary: Cancel an unopened delivery using its independent management capability.
      description: >
        Irreversible. Authorization ends at the original expiry. A repeated cancellation
        returns the same cancelled snapshot. A delivery that was opened, including one
        opened while this request was in flight, returns the unknown-ID 404. All
        responses use Cache-Control no-store. Status and cancellation share the
        management client/delivery rate limit.
      security:
        - managementToken: []
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200":
          description: Cancelled snapshot; includes repeat cancellations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementStatusResponse"
        "400":
          description: Authenticated request body is not an empty JSON object.
        "404":
          description: >
            Uniform management_unavailable for invalid or expired capabilities and
            for opened deliveries, including an open that wins the cancellation race.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: not_cancellable with the authenticated locked or unavailable snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error, status]
                properties:
                  error:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        const: not_cancellable
                      message:
                        type: string
                  status:
                    $ref: "#/components/schemas/ManagementStatusResponse"
        "429":
          description: Shared management rate limit exceeded.
        "503":
          description: Cancellation is temporarily unavailable; no cancellation success is implied.
  /api/secrets/{id}/finalize:
    post:
      operationId: finalizeSecret
      summary: Confirm a large secret upload by HEAD-checking the object and activating it.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret finalized and now openable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeSecretResponse"
        "404":
          description: Secret missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Secret is not pending upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Uploaded object missing or oversized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}/open:
    post:
      operationId: openSecret
      summary: Atomically verify access, consume the secret, and stream the encrypted body.
      description: |
        The body is the raw age file (contracts/age-format-v1.md), streamed
        without base64. The bucket read starts before the secret is marked
        consumed, so a store that cannot serve the body leaves it openable;
        a transfer that fails after the 200 status has been sent loses the
        secret. The stream must finish within 30 minutes. The open transaction
        deletes the secret and its management record, so afterwards every
        endpoint answers for this ID exactly as for an unknown ID.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSecretRequest"
      responses:
        "200":
          description: Secret opened. The body is the age file; metadata travels in headers.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Length:
              description: Exact age file length, equal to size_bytes.
              schema:
                type: integer
            Flick-Kind:
              required: true
              schema:
                type: string
                enum: [text, file]
            Flick-Expires-At:
              required: true
              schema:
                type: string
                format: date-time
            Flick-Content-Type:
              description: Media type for file download, when the sender set one.
              schema:
                type: string
            Flick-Encrypted-Filename:
              description: File secrets only. Base64 of the filename age file.
              schema:
                type: string
            Flick-Wrapped-Identity:
              description: Model A only. Base64 of the age scrypt file that wraps the secret's identity.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >
            invalid_json when the body is not exactly one OpenSecretRequest
            object, sensitive_field_forbidden when it names a field reserved for
            client-only material, and invalid_access_proof when access_proof is
            not base64. Nothing is consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: payload_too_large when the request body exceeds 64 KiB. Nothing is consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >
            rate_limited. FLICK_OPEN_RATE_PER_MIN per client network (IPv4
            address or IPv6 /64) and secret ID, so guesses against one secret
            do not slow the same client's access to another. Nothing is consumed.
          headers:
            Retry-After:
              schema: {type: string, const: "60"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            not_found for an unknown ID and for an already-opened secret,
            byte-identical: the successful open deleted every record of the ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access proof is invalid. The fifth invalid proof attempt removes the stored payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Secret locked by invalid access proofs (consumed) or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/secrets/{id}/cleanup:
    post:
      operationId: cleanupSecret
      summary: Internal worker endpoint for idempotent cleanup.
      security:
        - internalToken: []
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupSecretRequest"
      responses:
        "200":
          description: Cleanup completed or was already complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupSecretResponse"
        "400":
          description: Invalid cleanup metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/object-reconciliation/ack:
    post:
      operationId: acknowledgeObjectCleanup
      summary: Internal worker endpoint that acknowledges a finished object delete.
      description: >
        Removes only the pending reconciliation claim matching backend, object
        key, and job ID (contracts/internal-api.md). A claim that does not
        exist, including one for an unknown backend, returns the same 204.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeObjectCleanupRequest"
      responses:
        "204":
          description: Acknowledged, or no matching claim remained.
        "400":
          description: invalid_json for a malformed body or unknown field; invalid_cleanup for a blank job ID or an object key outside managed/secrets/ and managed/requests/.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: cleanup_ack_failed when the database write fails; the claim stays pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/requests:
    post:
      operationId: createRequest
      summary: Create a one-time request.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Tokens are returned only on creation; a lost response cannot recover them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
      responses:
        "201":
          description: Create a one-time request.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRequest"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}:
    get:
      operationId: getRequestInstructions
      summary: Read submission instructions without consuming.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Read submission instructions without consuming.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestInstructions"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/submit:
    post:
      operationId: submitRequest
      summary: Accept one immutable inline submission or return its existing receipt.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: Accept one immutable inline submission or return its existing receipt.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestReceipt"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/upload:
    post:
      operationId: reserveRequest
      summary: Reserve one immutable large file attempt or recover its existing instruction.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUpload"
      responses:
        "200":
          description: Reserve one immutable large file attempt or recover its existing instruction.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadResult"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/finalize:
    post:
      operationId: finalizeRequest
      summary: Verify stored bytes and accept the active file attempt once.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAttempt"
      responses:
        "200":
          description: Verify stored bytes and accept the active file attempt once.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestReceipt"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/abandon:
    post:
      operationId: abandonRequest
      summary: Invalidate only the matching active reservation and advance its generation.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAttempt"
      responses:
        "200":
          description: Invalidate only the matching active reservation and advance its generation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestWaiting"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/attempt:
    post:
      operationId: getRequestAttempt
      summary: Recover the outcome of the same generation and attempt without content.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAttempt"
      responses:
        "200":
          description: Recover the outcome of the same generation and attempt without content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAttemptStatus"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/owner:
    get:
      operationId: getRequestOwner
      summary: Read requester status without consuming.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{retrievalToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Read requester status without consuming.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOwner"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/open:
    post:
      operationId: openRequest
      summary: Release ciphertext at most once; never automatically retry.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
        The request body must be empty. A non-empty body is rejected.
      security: [{retrievalToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: >
            Request consumed. The body is the submitted age file, streamed; the
            request is consumed before the first byte, so a broken stream loses
            the submission (the client sees a truncated age file).
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
            Content-Length:
              description: Exact age file length, equal to the submitted size_bytes.
              schema:
                type: integer
            Flick-Kind:
              required: true
              schema:
                type: string
                enum: [text, file]
            Flick-Encrypted-Filename:
              description: File submissions only. Base64 of the filename age file.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/revoke:
    post:
      operationId: revokeRequest
      summary: Cancel and remove inline bytes or enqueue object cleanup; cancelled retries are idempotent.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
        The request body must be empty. A non-empty body is rejected.
      security: [{retrievalToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Cancel and remove inline bytes or enqueue object cleanup; cancelled retries are idempotent.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCancelled"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/pipe/init:
    post:
      operationId: initPipe
      summary: Initialize a live relay rendezvous.
      description: >-
        Generates a 6-digit pairing code and a sender token. The server issues
        no key material: the sender encrypts to the age recipient each
        receiver sends on /join, which /wait hands to the sender. The sender
        token is the only credential for /wait, /select,
        /decline, /cancel, and /send; keep it in browser memory. With
        require_confirmation the session is a waiting room (up to 10 receivers
        wait for the sender to pick one); without it the first receiver to call
        /receive wins. Rate-limited per client network (IPv4 address or IPv6 /64) by
        FLICK_CREATE_RATE_PER_MIN.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipeInitRequest"
      responses:
        "201":
          description: Pipe rendezvous initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeInitResponse"
        "400":
          description: Malformed body or unknown field.
        "429":
          description: Server at maximum concurrent pipe relay capacity, or client rate limit.
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/join:
    post:
      operationId: joinPipe
      summary: Join a rendezvous as a receiver.
      description: >-
        The only pipe call that accepts a bare 6-digit code; rate-limited by
        FLICK_OPEN_RATE_PER_MIN per client network (an IPv4 address or an IPv6
        /64), with one bucket shared by /api/pipe/join and /api/v1/pipe/join.
        Returns an unguessable connection ID scoped to the session. With
        confirmation on, the connection also gets its own random 3-digit
        verify_code (unique among the session's waiting connections) and a
        coarse device label parsed from the User-Agent; the receiver shows
        verify_code so the sender can pick it, then long-polls /status. A
        waiting connection stays in the room only while it polls /status: one
        with no open /status call for 35 seconds is dropped and its slot
        reopens. No rejection here ends the session or counts against it.
        The body carries the receiver's age recipient, generated fresh in the
        receiving browser for this connection. The API keeps it in memory with
        the connection and returns it only to the sender (/wait); the matching
        identity never leaves the receiving browser, so the API relays a
        stream it cannot decrypt.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipeJoinRequest"
      responses:
        "201":
          description: Connection admitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeJoinResponse"
        "400":
          description: >-
            `bad_request`: missing or invalid X-Flick-Pipe-Code header.
            `invalid_recipient`: the body is missing, not JSON, has an unknown
            field, or `recipient` is not a valid hybrid age recipient
            (`age1pq1` followed by lowercase bech32 characters, at most 4096
            characters, with a valid checksum and ML-KEM-768 + X25519 key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`declined`: the sender declined this client (same client IP and User-Agent) earlier in this session."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rendezvous not found or expired.
        "409":
          description: >-
            `already_connected`: another receiver already holds the transfer.
            `room_full`: 10 receivers are already waiting.
            `network_full`: 3 receivers from this client network (IPv4
            address or IPv6 /64) are already waiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: "`expired`: the 3-minute rendezvous window closed. `cancelled` or `closed`: the session ended."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Client network rate limit.
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/status:
    get:
      operationId: statusPipe
      summary: Long-poll a waiting connection until the sender decides.
      description: >-
        Confirmation on only. Returns at once with `selected` when the sender
        picked this connection; the receiver then opens /receive, which streams
        as soon as the sender starts. Otherwise holds up to 25 seconds and
        returns `waiting`, and the receiver polls again; the hold stays under
        proxy idle limits (Cloudflare cuts silent responses at 100 seconds).
        An open /status call is what keeps the connection in the room: a
        connection with no /status call for 35 seconds is dropped, which frees
        its slot without ending the session. The connection's end comes back
        as an error.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
        - $ref: "#/components/parameters/PipeConnection"
      responses:
        "200":
          description: Still waiting, or selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeReceiverStatusResponse"
        "400":
          description: Missing or invalid header.
        "403":
          description: "`declined`: the sender declined this connection."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rendezvous or connection not found (including a connection dropped for not polling).
        "409":
          description: >-
            `confirmation_disabled`: the session has no waiting room; open
            /receive directly. `poll_in_progress`: this connection already has
            2 /status calls open; wait for one to return.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: >-
            `not_selected`: the sender chose another device. `cancelled`: the
            sender cancelled the code. `expired` or `closed`: the session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            `rate_limited`: more than 120 /status calls a minute from this
            client network (IPv4 address or IPv6 /64), counted across
            /api/pipe/status and /api/v1/pipe/status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/receive:
    get:
      operationId: receivePipe
      summary: Receive the live stream on a joined connection.
      description: >-
        With confirmation on, only the connection the sender selected (as
        reported by /status) may open /receive; it returns the stream once the
        sender starts, and a still-waiting connection gets 409
        `awaiting_decision`. With confirmation off, the first connection to
        call /receive wins and later ones get 409 `already_connected`. The
        chosen receiver leaving before the stream starts ends the session; so
        does a selected connection that does not open /receive within 35
        seconds.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
        - $ref: "#/components/parameters/PipeConnection"
      responses:
        "200":
          description: Streaming an age file encrypted to this connection's recipient.
          headers:
            Flick-Kind:
              schema:
                type: string
              description: Optional descriptor kind (text or file).
            Flick-Encrypted-Filename:
              schema:
                type: string
              description: Optional base64-encoded age file of the filename, encrypted to this connection's recipient.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing or invalid header.
        "403":
          description: "`declined`: the sender declined this connection."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rendezvous or connection not found.
        "409":
          description: >-
            `already_connected`: confirmation off and another receiver connected
            first, or this connection already has an open /receive.
            `awaiting_decision`: confirmation on and the sender has not picked
            this connection yet; keep polling /status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: >-
            `not_selected`: the sender chose another device. `cancelled`: the
            sender cancelled the code. `expired` or `closed`: the session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/wait:
    get:
      operationId: waitPipe
      summary: Long-poll the sender's view of the rendezvous.
      description: >-
        Returns at once when the session version differs from `since`,
        otherwise holds up to 25 seconds and returns the unchanged view. The
        sender re-polls with the returned version. `status` turns `ready` once
        the chosen receiver is attached and /send can stream. `connections`
        lists waiting receivers in join order (always empty with confirmation
        off); a receiver that stopped polling /status for 35 seconds drops out
        of the list and bumps the version. Each listed connection carries its
        age recipient, and once `status` is `ready` the top-level `recipient`
        names the attached receiver's; with confirmation off that is how the
        sender learns whom to encrypt to. Only the sender token holder sees
        recipients.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
        - $ref: "#/components/parameters/PipeSender"
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Last version the sender has seen (0 or omitted for the first poll).
      responses:
        "200":
          description: Current sender view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeWaitResponse"
        "400":
          description: Missing header or invalid since.
        "404":
          description: Rendezvous not found, expired, or wrong sender token.
        "410":
          description: Rendezvous expired, cancelled, or closed.
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/select:
    post:
      operationId: selectPipe
      summary: Send to one waiting connection.
      description: >-
        Hands the transfer to the connection; every other waiting connection
        ends with `not_selected`. The sender then calls /send.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
        - $ref: "#/components/parameters/PipeSender"
        - $ref: "#/components/parameters/PipeConnection"
      responses:
        "200":
          description: Connection chosen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeActionResponse"
        "400":
          description: Missing header.
        "404":
          description: Rendezvous not found, or wrong sender token.
        "409":
          description: >-
            `already_connected`; `not_pending`: the connection was declined,
            left the room (dropped for not polling /status), or never existed in
            this session; or `confirmation_disabled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: "`expired`: the 3-minute rendezvous window closed. `cancelled` or `closed`: the session ended."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/decline:
    post:
      operationId: declinePipe
      summary: Decline one waiting connection.
      description: >-
        Ends that connection with `declined`, reopens its slot, and blocks the
        same client (hash of client IP and User-Agent, held in memory for the
        session only) from joining this session again. The session stays alive.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
        - $ref: "#/components/parameters/PipeSender"
        - $ref: "#/components/parameters/PipeConnection"
      responses:
        "200":
          description: Connection declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeActionResponse"
        "400":
          description: Missing header.
        "404":
          description: Rendezvous not found, or wrong sender token.
        "409":
          description: >-
            `not_pending`: the connection was already settled, left the room, or
            never existed in this session; or `confirmation_disabled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Rendezvous expired, cancelled, or closed.
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/cancel:
    post:
      operationId: cancelPipe
      summary: Cancel the code before streaming starts.
      description: >-
        Burns the whole session; waiting receivers end with `cancelled`. A
        transfer that is already streaming is never cut by this call (409
        `streaming`); the sender stops a stream by aborting its own /send.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
        - $ref: "#/components/parameters/PipeSender"
      responses:
        "200":
          description: Session cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeActionResponse"
        "400":
          description: Missing header.
        "404":
          description: Rendezvous not found, expired, or wrong sender token.
        "409":
          description: "`streaming`: the transfer already started."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Live pipe relay is disabled.
  /api/pipe/send:
    post:
      operationId: sendPipe
      summary: Send the live stream to the chosen receiver.
      description: >-
        Waits for the chosen receiver (first-come with confirmation off, the
        selected connection with it on), then streams the request body into the
        in-memory pipe.
      parameters:
        - $ref: "#/components/parameters/PipeCode"
        - $ref: "#/components/parameters/PipeSender"
        - name: Flick-Kind
          in: header
          required: false
          schema:
            type: string
        - name: Flick-Encrypted-Filename
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stream completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeSendResponse"
        "400":
          description: Missing or invalid header.
        "404":
          description: Rendezvous not found, expired, or wrong sender token.
        "409":
          description: Sender already active on this session.
        "410":
          description: Rendezvous expired, cancelled, or closed.
        "502":
          description: Stream transfer failed or receiver disconnected.
        "503":
          description: Live pipe relay is disabled.
components:
  headers:
    RequestNoStore:
      schema: {type: string, const: no-store}
  responses:
    RequestInvalid:
      description: Malformed input, unknown fields, invalid crypto metadata, or query parameters.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: invalid_request}
    RequestUnavailable:
      description: Unknown ID, missing or wrong role capability, expired request, or stale generation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: request_unavailable}
    RequestConflict:
      description: A conflicting attempt or state; consumed requests cannot be revoked.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: request_conflict}
    RequestTooLarge:
      description: HTTP body exceeds its endpoint bound or content exceeds the configured inline or file-size limit.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: payload_too_large}
    RequestRateLimited:
      description: Per-client rate exceeded. Uses existing create/open rate configuration.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
        Retry-After:
          schema: {type: string, const: "60"}
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: rate_limited}
    RequestStorageUnavailable:
      description: >
        Temporary storage failure (storage_unavailable), or storage_full when a
        large upload reservation fits under no object storage backend's
        total-size ceiling. No transition was committed; retry the same
        immutable submission only.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {enum: [storage_unavailable, storage_full]}
  securitySchemes:
    submissionToken:
      type: http
      scheme: bearer
      description: Independent 32-byte submission capability in canonical unpadded base64url; never accepted in a query or path.
    retrievalToken:
      type: http
      scheme: bearer
      description: Independent 32-byte requester capability in canonical unpadded base64url; cannot submit.
    managementToken:
      type: http
      scheme: bearer
      description: Independent per-delivery capability, valid until the original expiry.
    internalToken:
      type: apiKey
      in: header
      name: X-Flick-Internal-Token
    metricsToken:
      type: http
      scheme: bearer
      description: Static pre-shared FLICK_METRICS_TOKEN for the Prometheus scraper; cannot reach /internal/*.
  parameters:
    PipeCode:
      name: X-Flick-Pipe-Code
      in: header
      required: true
      schema:
        type: string
      description: 6-digit numeric pairing code (dashes and spaces are ignored).
    PipeSender:
      name: X-Flick-Pipe-Sender
      in: header
      required: true
      schema:
        type: string
      description: Sender token from /api/pipe/init. A wrong token answers 404 like an unknown code.
    PipeConnection:
      name: X-Flick-Pipe-Connection
      in: header
      required: true
      schema:
        type: string
      description: Connection ID from /api/pipe/join.
    SecretId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    RequestCapability:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Canonical unpadded base64url encoding of exactly 32 bytes, including zero trailing pad bits.
    RequestPublicKey:
      type: string
      maxLength: 2400
      pattern: '^age1pq1[02-9ac-hj-np-z]+$'
      description: >
        Hybrid ML-KEM-768 + X25519 age recipient in canonical lowercase Bech32
        (about 1960 characters). No other recipient type is accepted. The
        fingerprint is unpadded base64url SHA-256 of this exact string.
    RequestGeneration:
      type: integer
      minimum: 1
      maximum: 16
      description: Current generation from instructions. Inline requests remain at generation 1; a stale generation is unavailable.
    CreateRequest:
      type: object
      additionalProperties: false
      required: [public_key]
      properties:
        public_key:
          $ref: "#/components/schemas/RequestPublicKey"
        ttl_seconds:
          type: integer
          minimum: 1
          description: Within configured min/max TTL (defaults 300..604800). Omission uses the configured default (3600); zero and null are invalid. Submission does not extend expiry.
    CreatedRequest:
      type: object
      additionalProperties: false
      required: [id, expires_at, submission_token, retrieval_token]
      properties:
        id: {type: string}
        expires_at: {type: string, format: date-time}
        submission_token:
          $ref: "#/components/schemas/RequestCapability"
        retrieval_token:
          $ref: "#/components/schemas/RequestCapability"
    RequestInstructions:
      type: object
      additionalProperties: false
      required: [public_key, fingerprint, expires_at, generation, can_submit]
      properties:
        public_key:
          $ref: "#/components/schemas/RequestPublicKey"
        fingerprint:
          $ref: "#/components/schemas/RequestCapability"
        expires_at: {type: string, format: date-time}
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        can_submit: {type: boolean}
    RequestOwner:
      type: object
      additionalProperties: false
      required: [public_key, fingerprint, expires_at, state]
      properties:
        public_key:
          $ref: "#/components/schemas/RequestPublicKey"
        fingerprint:
          $ref: "#/components/schemas/RequestCapability"
        expires_at: {type: string, format: date-time}
        state:
          type: string
          enum: [waiting, uploading, submitted, consumed, cancelled]
    RequestEnvelope:
      type: object
      additionalProperties: false
      required: [version]
      description: >
        Serialized JSON is at most 8192 bytes. Version 2 is the age format
        (contracts/age-format-v1.md): the body and the filename are each an age
        file to the request's recipient. The API checks shapes, lengths and the
        age header magic; only the client can authenticate ciphertext.
      properties:
        version: {type: integer, const: 2}
        encrypted_filename:
          type: string
          format: byte
          maxLength: 5464
          description: Canonical standard base64 of an age file of at most 4096 bytes encrypting the UTF-8 filename.
    RequestKindRules:
      if:
        properties:
          kind: {const: text}
      then:
        properties:
          envelope:
            properties:
              encrypted_filename: false
      else:
        properties:
          envelope:
            required: [encrypted_filename]
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [generation, attempt_token, kind, size_bytes, envelope, ciphertext]
      allOf:
        - $ref: "#/components/schemas/RequestKindRules"
      description: >
        Keep the attempt token and immutable kind, size, envelope, and ciphertext
        through an unknown outcome. Exact immutable-content retries return the
        original submitted receipt, including after consumption or cancellation,
        until the original deadline. Different content or token conflicts.
        JSON whitespace and property order do not change immutable content.
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        attempt_token:
          $ref: "#/components/schemas/RequestCapability"
        kind: {type: string, enum: [text, file]}
        size_bytes:
          type: integer
          format: int64
          minimum: 22
          description: Exact age file length, within the configured inline limit; files also within the object limit.
        envelope:
          $ref: "#/components/schemas/RequestEnvelope"
        ciphertext:
          type: string
          format: byte
          description: Canonical standard base64 of exactly size_bytes decoded bytes, starting with the age header magic.
    RequestUpload:
      type: object
      additionalProperties: false
      required: [generation, attempt_token, kind, size_bytes, envelope, ciphertext_sha256]
      allOf:
        - $ref: "#/components/schemas/RequestKindRules"
      description: >
        Strict immutable file reservation, bounded to 16384 HTTP body bytes.
        size_bytes is the exact age file length; it cannot exceed the largest age
        file a maximum-size file produces. Any file may take this path. Finalize
        accepts the upload only if it has that length and checksum and starts
        with the age header magic. The attempt digest covers the
        canonical envelope, kind, size and checksum. Retries never extend either
        deadline; different metadata or another active attempt conflicts.
        S3 disabled or signing failures return storage_unavailable.
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        attempt_token:
          $ref: "#/components/schemas/RequestCapability"
        kind: {type: string, const: file}
        size_bytes: {type: integer, format: int64, minimum: 22, description: Exact age file length.}
        envelope:
          $ref: "#/components/schemas/RequestEnvelope"
        ciphertext_sha256:
          type: string
          format: byte
          minLength: 44
          maxLength: 44
          description: Canonical standard base64 SHA-256 of the exact ciphertext bytes, exactly 32 decoded bytes.
    RequestUploadResult:
      oneOf:
        - $ref: "#/components/schemas/RequestUploading"
        - $ref: "#/components/schemas/RequestReceipt"
      description: An already accepted identical attempt returns only the historical submitted receipt, without another upload instruction.
    RequestUploading:
      type: object
      additionalProperties: false
      required: [generation, state, upload, reservation_expires_at]
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        state: {type: string, const: uploading}
        upload:
          $ref: "#/components/schemas/PresignedUpload"
        reservation_expires_at:
          type: string
          format: date-time
          description: Original reservation deadline, at most 15 minutes and no later than request expiry. Upload expires_at equals this deadline. The server-only final object key is never disclosed.
    RequestWaiting:
      type: object
      additionalProperties: false
      required: [generation, state]
      description: Abandon advances the generation atomically. Ending generation 16 instead returns 404 request_unavailable. An old generation is never accepted again, including repeat abandon.
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        state: {type: string, const: waiting}
    RequestAttempt:
      type: object
      additionalProperties: false
      required: [generation, attempt_token]
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        attempt_token:
          $ref: "#/components/schemas/RequestCapability"
    RequestReceipt:
      type: object
      additionalProperties: false
      required: [generation, state]
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        state: {type: string, const: submitted}
    RequestAttemptStatus:
      type: object
      additionalProperties: false
      required: [generation, state]
      description: accepted records acceptance, not current deliverability or a human read. A different losing attempt returns unavailable.
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        state: {type: string, enum: [waiting, uploading, accepted, unavailable]}
    RequestCancelled:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, const: cancelled}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ConfigResponse:
      type: object
      description: >
        Public client-facing size limits, counted before encryption. payload_inline_max_bytes is
        the inline (SQLite BLOB) path threshold — files above it take the S3
        path; max_file_bytes is the absolute bound the server rejects above.
        Both already subtract age overhead, so the age file of any content
        within them fits the server's ciphertext caps. Flat so future fields
        can be added non-destructively.
      additionalProperties: true
      required: [payload_inline_max_bytes, max_file_bytes]
      properties:
        payload_inline_max_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Files at or below this size take the inline path.
        max_file_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Absolute upper bound; files above this are rejected by client and server.
        pipe_relay_enabled:
          type: boolean
          description: Whether live in-memory pipe relay transfer is enabled on this server.
    PipeInitRequest:
      type: object
      additionalProperties: false
      properties:
        require_confirmation:
          type: boolean
          default: false
          description: Hold receivers in a waiting room until the sender picks one.
    PipeInitResponse:
      type: object
      additionalProperties: false
      required: [code, expires_in, sender_token, require_confirmation]
      properties:
        code:
          type: string
          description: 6-digit numeric pairing code.
        expires_in:
          type: integer
          description: Rendezvous window in seconds. A transfer that has started streaming is not cut by it.
        sender_token:
          type: string
          description: Credential for the sender-side pipe calls. Never log it.
        require_confirmation:
          type: boolean
    PipeJoinRequest:
      type: object
      additionalProperties: false
      required: [recipient]
      properties:
        recipient:
          $ref: "#/components/schemas/PipeRecipient"
    PipeRecipient:
      type: string
      maxLength: 4096
      pattern: "^age1pq1[02-9ac-hj-np-z]+$"
      description: >-
        Hybrid ML-KEM-768 + X25519 age recipient (about 1,960 characters)
        that the receiving browser generated for this one connection. Public
        key only; the identity never reaches the API.
    PipeJoinResponse:
      type: object
      additionalProperties: false
      required: [connection_id, require_confirmation, expires_in]
      properties:
        connection_id:
          type: string
          description: Unguessable crypto/rand ID scoped to this session.
        require_confirmation:
          type: boolean
        verify_code:
          type: string
          pattern: "^[0-9]{3}$"
          description: Present only with confirmation on. Random per connection, independent of the 6-digit code. Never log it.
        device:
          type: string
          description: Present only with confirmation on. Coarse label such as "Safari on iPhone"; the raw User-Agent is never stored.
        expires_in:
          type: integer
          description: Seconds left in the rendezvous window.
    PipeWaitResponse:
      type: object
      additionalProperties: false
      required: [status, version, connections]
      properties:
        status:
          type: string
          enum: [waiting, ready]
        version:
          type: integer
          description: Pass back as `since` on the next poll.
        recipient:
          allOf:
            - $ref: "#/components/schemas/PipeRecipient"
          description: Present only when `status` is `ready`. The attached receiver's age recipient; encrypt the stream and filename to it.
        connections:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PipePendingConnection"
    PipePendingConnection:
      type: object
      additionalProperties: false
      required: [connection_id, index, verify_code, device, recipient, connected_seconds]
      properties:
        connection_id:
          type: string
        index:
          type: integer
          description: 1-based join order within the session.
        verify_code:
          type: string
          pattern: "^[0-9]{3}$"
        device:
          type: string
        recipient:
          allOf:
            - $ref: "#/components/schemas/PipeRecipient"
          description: This connection's age recipient; encrypt to it when selecting this connection.
        connected_seconds:
          type: integer
          description: Seconds since the connection joined, measured by the server.
    PipeReceiverStatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [waiting, selected]
          description: "`selected`: open /receive now. `waiting`: poll /status again."
    PipeActionResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [selected, declined, cancelled]
    PipeSendResponse:
      type: object
      additionalProperties: false
      required: [status, bytes_transferred]
      properties:
        status:
          type: string
          enum: [completed]
        bytes_transferred:
          type: integer
          format: int64
          description: Total bytes passed through the in-memory pipe.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    CreateSecretRequest:
      type: object
      additionalProperties: false
      description: |
        Bodies, filenames, and wrapped identities are age files
        (contracts/age-format-v1.md). Model A: send `access` and
        `wrapped_identity` together; the client wraps the secret's identity
        with the user-entered value (age scrypt) and derives the access proof from it. Model B: omit
        both; the identity travels in the share URL fragment. Mixing the two
        (one without the other) is rejected.
      required:
        - kind
        - size_bytes
        - ttl_seconds
      properties:
        kind:
          type: string
          enum: [text, file]
        ciphertext:
          type: string
          description: Base64 of the body age file for the inline path. Omit it to receive a presigned upload instead; only file secrets may do so, text is always inline.
        access:
          $ref: "#/components/schemas/AccessVerifier"
        wrapped_identity:
          type: string
          description: Model A only. Base64 of the age scrypt file wrapping the secret's identity, at most 1 KiB decoded.
        encrypted_filename:
          type: string
          description: Required for file secrets, rejected for text. Base64 of the filename age file, at most 8 KiB decoded.
        content_type:
          type: string
          maxLength: 255
          pattern: '^[\x20-\x7e]*$'
          description: Media type for file download, or application/octet-stream. Printable ASCII only, because the open response returns it as a header.
        size_bytes:
          type: integer
          minimum: 0
          description: Exact byte length of the body age file. Inline bodies must match it; large bodies are signed and finalized at exactly this length.
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 604800
          description: Lifetime in seconds, anywhere from 5 minutes to 7 days.
        max_views:
          type: integer
          minimum: 1
          default: 1
    CreateSecretResponse:
      type: object
      additionalProperties: false
      required: [id, expires_at, management_token, management_expires_at]
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        management_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Canonical unpadded base64url encoding of 32 independent random bytes.
        management_expires_at:
          type: string
          format: date-time
          description: Equal to expires_at; reads never extend the deadline.
        upload:
          allOf:
            - $ref: "#/components/schemas/PresignedUpload"
          description: Present only for large secrets (request omitted ciphertext). The client sends the raw ciphertext as the request body to `url`, echoing `headers`, then calls /finalize.
    ManagementStatusResponse:
      type: object
      additionalProperties: false
      required: [id, status, expires_at, management_expires_at, can_cancel]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending_upload, active, locked, cancelled, unavailable]
        expires_at:
          type: string
          format: date-time
        management_expires_at:
          type: string
          format: date-time
        can_cancel:
          type: boolean
          description: Whether the current delivery is eligible for cancellation.
    PresignedUpload:
      type: object
      additionalProperties: false
      description: >
        A presigned upload for sending the body age file directly to the object
        store. Content-Length is part of the signature and equals size_bytes,
        so a body of any other length fails authentication at the bucket and no
        object lands. PUT rather than POST because Oracle's S3
        Compatibility API does not implement POST Object.
      required: [url, method, expires_at, headers]
      properties:
        url:
          type: string
        method:
          type: string
          enum: [PUT]
        expires_at:
          type: string
          format: date-time
        headers:
          type: object
          description: >
            Signed request headers. The client echoes each one except
            Content-Length, which browsers forbid setting and derive from the
            request body — which is exactly the signed value.
          additionalProperties:
            type: string
    FinalizeSecretResponse:
      type: object
      additionalProperties: false
      required: [id, finalized]
      properties:
        id:
          type: string
        finalized:
          type: boolean
    AccessVerifier:
      type: object
      additionalProperties: false
      description: Model A only. When present on a create request, both fields are required.
      required: [kdf, proof]
      properties:
        kdf:
          $ref: "#/components/schemas/KdfParams"
        proof:
          type: string
          description: Base64-encoded client-derived access proof (Model A only).
    AccessMetadata:
      type: object
      additionalProperties: false
      required: [kdf]
      properties:
        kdf:
          $ref: "#/components/schemas/KdfParams"
    GetSecretMetadataResponse:
      type: object
      additionalProperties: false
      description: |
        The `access` block is present only for Model A secrets, so the browser
        can derive the access proof. Model B secrets omit it; the browser opens
        using the URL fragment key without a proof.
      required:
        - id
        - kind
        - size_bytes
        - expires_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [text, file]
        access:
          $ref: "#/components/schemas/AccessMetadata"
        size_bytes:
          type: integer
          minimum: 0
          description: Exact byte length of the body age file.
        expires_at:
          type: string
          format: date-time
    OpenSecretRequest:
      type: object
      additionalProperties: false
      description: |
        Model A requires `access_proof` (derived from user input and metadata
        access KDF). Model B omits it; the link is the capability.
      required: []
      properties:
        access_proof:
          type: string
          description: Base64-encoded proof derived from local user input and metadata access KDF. Required for Model A, omitted for Model B.
    KdfParams:
      type: object
      additionalProperties: false
      required:
        - algorithm
        - salt
        - iterations
        - key_length_bits
      properties:
        algorithm:
          type: string
          enum: [PBKDF2-SHA-256]
        salt:
          type: string
          description: Base64-encoded random KDF salt.
        iterations:
          type: integer
          minimum: 600000
          maximum: 6000000
        key_length_bits:
          type: integer
          enum: [256]
    CleanupSecretRequest:
      type: object
      additionalProperties: false
      required: [job_id, reason]
      properties:
        job_id:
          type: string
          minLength: 1
        reason:
          type: string
          enum: [consumed, expired, orphan, manual, retry]
    AcknowledgeObjectCleanupRequest:
      type: object
      additionalProperties: false
      required: [job_id, object_key]
      properties:
        backend:
          type: string
          description: Bucket the delete ran against (s3_object primary, r2_object secondary). Absent or empty means the primary; the value is not validated against this list.
        job_id:
          type: string
          minLength: 1
        object_key:
          type: string
          description: Key inside managed/secrets/ or managed/requests/ with a nonempty suffix.
    CleanupSecretResponse:
      type: object
      additionalProperties: false
      required: [id, cleaned]
      properties:
        id:
          type: string
        cleaned:
          type: boolean
