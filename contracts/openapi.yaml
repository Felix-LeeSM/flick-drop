openapi: 3.1.0
info:
  title: Flick API
  version: 0.1.0
  description: HTTP contract for Flick web clients.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealthz
      responses:
        "200":
          description: API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadyz
      responses:
        "200":
          description: API dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API dependency is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
  /api/config:
    get:
      operationId: getConfig
      summary: Public client-facing size limits.
      description: >
        Lets the browser size-gate file uploads and route large files to the S3
        path. Values are advisory — the server re-enforces both limits, so a
        tampered client value cannot bypass them. TTL bounds are not exposed
        here (they travel to the client at build time).
      responses:
        "200":
          description: Client-facing limits.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
  /api/secrets:
    post:
      operationId: createSecret
      summary: Create an encrypted secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          description: Secret created; the independent management token is returned only here.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSecretResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}:
    get:
      operationId: getSecretMetadata
      summary: Fetch safe metadata needed to derive an access proof.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Metadata found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSecretMetadataResponse"
        "404":
          description: Secret missing, expired, or consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Secret already consumed or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}/management:
    get:
      operationId: getManagementStatus
      summary: Read delivery status using its independent management capability.
      description: >
        Valid only before the original expiry. Opened means the release transaction
        committed; it does not confirm reading or decryption. This read never consumes
        the delivery. Cancellation is not implemented by this endpoint.
      security:
        - managementToken: []
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Authenticated status snapshot.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementStatusResponse"
        "404":
          description: management_unavailable for missing, invalid, mismatched, or expired capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Management rate limit exceeded; recipient attempts are unaffected.
        "503":
          description: Status temporarily unavailable; no terminal outcome is implied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}/revoke:
    post:
      operationId: revokeSecret
      summary: Cancel an unopened delivery using its independent management capability.
      description: >
        Irreversible. Authorization ends at the original expiry. A repeated cancellation
        returns the same cancelled snapshot. All responses use Cache-Control no-store.
        Status and cancellation share the management client/delivery rate limit.
      security:
        - managementToken: []
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200":
          description: Cancelled snapshot; includes repeat cancellations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementStatusResponse"
        "400":
          description: Authenticated request body is not an empty JSON object.
        "404":
          description: Uniform management_unavailable for invalid or expired capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: not_cancellable with the authenticated opened, locked, or unavailable snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error, status]
                properties:
                  error:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        const: not_cancellable
                      message:
                        type: string
                  status:
                    $ref: "#/components/schemas/ManagementStatusResponse"
        "429":
          description: Shared management rate limit exceeded.
        "503":
          description: Cancellation is temporarily unavailable; no cancellation success is implied.
  /api/secrets/{id}/finalize:
    post:
      operationId: finalizeSecret
      summary: Confirm a large secret upload by HEAD-checking the object and activating it.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret finalized and now openable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeSecretResponse"
        "404":
          description: Secret missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Secret is not pending upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Uploaded object missing or oversized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/secrets/{id}/open:
    post:
      operationId: openSecret
      summary: Atomically verify access, consume the secret, and return encrypted payload.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSecretRequest"
      responses:
        "200":
          description: Secret opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSecretResponse"
        "404":
          description: Secret missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access proof is invalid. The fifth invalid proof attempt removes the stored payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Secret already consumed or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/secrets/{id}/cleanup:
    post:
      operationId: cleanupSecret
      summary: Internal worker endpoint for idempotent cleanup.
      security:
        - internalToken: []
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupSecretRequest"
      responses:
        "200":
          description: Cleanup completed or was already complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupSecretResponse"
        "400":
          description: Invalid cleanup metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid internal token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/requests:
    post:
      operationId: createRequest
      summary: Create a one-time inline request.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Tokens are returned only on creation; a lost response cannot recover them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
      responses:
        "201":
          description: Create a one-time inline request.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRequest"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}:
    get:
      operationId: getRequestInstructions
      summary: Read submission instructions without consuming.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Read submission instructions without consuming.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestInstructions"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/submit:
    post:
      operationId: submitRequest
      summary: Accept one immutable inline submission or return its existing receipt.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: Accept one immutable inline submission or return its existing receipt.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestReceipt"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/attempt:
    post:
      operationId: getRequestAttempt
      summary: Recover the outcome of the same generation and attempt without content.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{submissionToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAttempt"
      responses:
        "200":
          description: Recover the outcome of the same generation and attempt without content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAttemptStatus"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/owner:
    get:
      operationId: getRequestOwner
      summary: Read requester status without consuming.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
      security: [{retrievalToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Read requester status without consuming.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOwner"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/open:
    post:
      operationId: openRequest
      summary: Release ciphertext at most once; never automatically retry.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
        The request body must be empty. A non-empty body is rejected.
      security: [{retrievalToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Release ciphertext at most once; never automatically retry.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPayload"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
  /api/requests/{id}/revoke:
    post:
      operationId: revokeRequest
      summary: Cancel and remove inline bytes; cancelled retries are idempotent.
      description: >
        All responses use Cache-Control no-store. Query parameters are rejected.
        Send only the matching canonical 32-byte capability in Authorization.
        Unknown, expired, and unauthorized requests have the same 404 response.
        The request body must be empty. A non-empty body is rejected.
      security: [{retrievalToken: []}]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Cancel and remove inline bytes; cancelled retries are idempotent.
          headers:
            Cache-Control:
              $ref: "#/components/headers/RequestNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCancelled"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "404":
          $ref: "#/components/responses/RequestUnavailable"
        "409":
          $ref: "#/components/responses/RequestConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RequestRateLimited"
        "503":
          $ref: "#/components/responses/RequestStorageUnavailable"
components:
  headers:
    RequestNoStore:
      schema: {type: string, const: no-store}
  responses:
    RequestInvalid:
      description: Malformed input, unknown fields, invalid crypto metadata, or query parameters.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: invalid_request}
    RequestUnavailable:
      description: Unknown ID, missing or wrong role capability, expired request, or stale generation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: request_unavailable}
    RequestConflict:
      description: A conflicting attempt or state; consumed requests cannot be revoked.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: request_conflict}
    RequestTooLarge:
      description: HTTP body or ciphertext exceeds the configured inline limit; large request uploads are not available.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: payload_too_large}
    RequestRateLimited:
      description: Per-client rate exceeded. Uses existing create/open rate configuration.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
        Retry-After:
          schema: {type: string, const: "60"}
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: rate_limited}
    RequestStorageUnavailable:
      description: Temporary storage failure. No transition was committed; retry the same immutable submission only.
      headers:
        Cache-Control:
          $ref: "#/components/headers/RequestNoStore"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code: {const: storage_unavailable}
  securitySchemes:
    submissionToken:
      type: http
      scheme: bearer
      description: Independent 32-byte submission capability in canonical unpadded base64url; never accepted in a query or path.
    retrievalToken:
      type: http
      scheme: bearer
      description: Independent 32-byte requester capability in canonical unpadded base64url; cannot submit.
    managementToken:
      type: http
      scheme: bearer
      description: Independent per-delivery capability, valid until the original expiry.
    internalToken:
      type: apiKey
      in: header
      name: X-Flick-Internal-Token
  parameters:
    SecretId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    RequestCapability:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Canonical unpadded base64url encoding of exactly 32 bytes, including zero trailing pad bits.
    RequestPublicKey:
      type: string
      format: byte
      maxLength: 684
      description: Canonical standard base64 DER SPKI RSA public key; modulus 2048 bits, exponent 65537. No other key type is accepted.
    RequestGeneration:
      type: integer
      minimum: 1
      maximum: 16
      description: Current generation from instructions. Inline requests remain at generation 1; a stale generation is unavailable.
    CreateRequest:
      type: object
      additionalProperties: false
      required: [public_key]
      properties:
        public_key:
          $ref: "#/components/schemas/RequestPublicKey"
        ttl_seconds:
          type: integer
          minimum: 1
          description: Within configured min/max TTL (defaults 300..604800). Omission uses the configured default (3600); zero and null are invalid. Submission does not extend expiry.
    CreatedRequest:
      type: object
      additionalProperties: false
      required: [id, expires_at, submission_token, retrieval_token]
      properties:
        id: {type: string}
        expires_at: {type: string, format: date-time}
        submission_token:
          $ref: "#/components/schemas/RequestCapability"
        retrieval_token:
          $ref: "#/components/schemas/RequestCapability"
    RequestInstructions:
      type: object
      additionalProperties: false
      required: [public_key, fingerprint, expires_at, generation, can_submit]
      properties:
        public_key:
          $ref: "#/components/schemas/RequestPublicKey"
        fingerprint:
          $ref: "#/components/schemas/RequestCapability"
        expires_at: {type: string, format: date-time}
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        can_submit: {type: boolean}
    RequestOwner:
      type: object
      additionalProperties: false
      required: [public_key, fingerprint, expires_at, state]
      properties:
        public_key:
          $ref: "#/components/schemas/RequestPublicKey"
        fingerprint:
          $ref: "#/components/schemas/RequestCapability"
        expires_at: {type: string, format: date-time}
        state:
          type: string
          enum: [waiting, submitted, consumed, cancelled]
    RequestEnvelope:
      type: object
      additionalProperties: false
      required: [version, algorithm, wrapped_key, nonce]
      description: >
        Serialized JSON is at most 4096 bytes. Binary fields require canonical
        standard base64. Version 1 uses RSA-OAEP SHA-256/MGF1-SHA-256 and
        AES-256-GCM with a 16-byte tag. Clients must enforce the request ID and
        kind bindings defined in docs/architecture/request-links.md. The API
        validates shapes and lengths; only the client can authenticate ciphertext.
      properties:
        version: {type: integer, const: 1}
        algorithm: {type: string, const: RSA-OAEP-256+A256GCM}
        wrapped_key:
          type: string
          format: byte
          minLength: 344
          maxLength: 344
          description: Exactly 256 decoded bytes wrapping a fresh 32-byte AES key.
        nonce:
          type: string
          format: byte
          minLength: 16
          maxLength: 16
          description: Exactly 12 decoded bytes.
        encrypted_filename:
          type: object
          additionalProperties: false
          required: [nonce, ciphertext]
          properties:
            nonce:
              type: string
              format: byte
              minLength: 16
              maxLength: 16
              description: Exactly 12 decoded bytes; must differ from payload nonce.
            ciphertext:
              type: string
              format: byte
              minLength: 24
              maxLength: 1388
              description: 17..1040 decoded bytes.
    RequestKindRules:
      if:
        properties:
          kind: {const: text}
      then:
        properties:
          envelope:
            properties:
              encrypted_filename: false
      else:
        properties:
          envelope:
            required: [encrypted_filename]
    RequestPayload:
      type: object
      additionalProperties: false
      required: [kind, size_bytes, envelope, ciphertext]
      allOf:
        - $ref: "#/components/schemas/RequestKindRules"
      properties:
        kind: {type: string, enum: [text, file]}
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Original content length. Ciphertext must fit the configured inline bound; files also obey the configured file-size limit.
        envelope:
          $ref: "#/components/schemas/RequestEnvelope"
        ciphertext:
          type: string
          format: byte
          description: Canonical standard base64 of exactly size_bytes + 16 decoded bytes.
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [generation, attempt_token, kind, size_bytes, envelope, ciphertext]
      allOf:
        - $ref: "#/components/schemas/RequestKindRules"
      description: >
        Keep the attempt token and immutable kind, size, envelope, and ciphertext
        through an unknown outcome. Exact immutable-content retries return the
        original submitted receipt, including after consumption or cancellation,
        until the original deadline. Different content or token conflicts.
        JSON whitespace and property order do not change immutable content.
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        attempt_token:
          $ref: "#/components/schemas/RequestCapability"
        kind: {type: string, enum: [text, file]}
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        envelope:
          $ref: "#/components/schemas/RequestEnvelope"
        ciphertext:
          type: string
          format: byte
          description: Canonical standard base64 of exactly size_bytes + 16 decoded bytes, within the configured inline limit.
    RequestAttempt:
      type: object
      additionalProperties: false
      required: [generation, attempt_token]
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        attempt_token:
          $ref: "#/components/schemas/RequestCapability"
    RequestReceipt:
      type: object
      additionalProperties: false
      required: [generation, state]
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        state: {type: string, const: submitted}
    RequestAttemptStatus:
      type: object
      additionalProperties: false
      required: [generation, state]
      description: accepted records acceptance, not current deliverability or a human read. A different losing attempt returns unavailable.
      properties:
        generation:
          $ref: "#/components/schemas/RequestGeneration"
        state: {type: string, enum: [waiting, accepted, unavailable]}
    RequestCancelled:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, const: cancelled}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ConfigResponse:
      type: object
      description: >
        Public client-facing size limits. payload_inline_max_bytes is the inline
        (SQLite BLOB) path threshold — files above it take the S3 path;
        max_file_bytes is the absolute bound the server rejects above. Flat so
        future fields can be added non-destructively.
      additionalProperties: true
      required: [payload_inline_max_bytes, max_file_bytes]
      properties:
        payload_inline_max_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Files at or below this size take the inline path.
        max_file_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Absolute upper bound; files above this are rejected by client and server.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    CreateSecretRequest:
      type: object
      additionalProperties: false
      description: |
        Model A: send `kdf` and `access` together; the browser derives the
        encryption key and access proof from a user-supplied value. Model B:
        omit `kdf` and `access`; the browser encrypts with a random key carried
        in the share URL fragment. Mixing the two (one without the other) is
        rejected.
      required:
        - kind
        - nonce
        - size_bytes
        - ttl_seconds
      properties:
        kind:
          type: string
          enum: [text, file]
        ciphertext:
          type: string
          description: Base64-encoded encrypted payload.
        nonce:
          type: string
          description: Base64-encoded AES-GCM nonce.
        kdf:
          $ref: "#/components/schemas/KdfParams"
        access:
          $ref: "#/components/schemas/AccessVerifier"
        encrypted_filename:
          type: string
          description: Required for file secrets. Browser-encrypted JSON envelope containing filename metadata.
        content_type:
          type: string
          description: Media type for file download, or application/octet-stream.
        size_bytes:
          type: integer
          minimum: 0
          description: Plain payload byte length before browser encryption.
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 604800
          description: Lifetime in seconds, anywhere from 5 minutes to 7 days.
        max_views:
          type: integer
          minimum: 1
          default: 1
    CreateSecretResponse:
      type: object
      additionalProperties: false
      required: [id, expires_at, management_token, management_expires_at]
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        management_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Canonical unpadded base64url encoding of 32 independent random bytes.
        management_expires_at:
          type: string
          format: date-time
          description: Equal to expires_at; reads never extend the deadline.
        upload:
          allOf:
            - $ref: "#/components/schemas/PresignedUpload"
          description: Present only for large secrets (request omitted ciphertext). The client sends the raw ciphertext as the request body to `url`, echoing `headers`, then calls /finalize.
    ManagementStatusResponse:
      type: object
      additionalProperties: false
      required: [id, status, expires_at, management_expires_at, can_cancel]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending_upload, active, opened, locked, cancelled, unavailable]
        expires_at:
          type: string
          format: date-time
        management_expires_at:
          type: string
          format: date-time
        can_cancel:
          type: boolean
          description: Whether the current delivery is eligible for cancellation.
    PresignedUpload:
      type: object
      additionalProperties: false
      description: >
        A presigned upload for sending ciphertext directly to the object store.
        Content-Length is part of the signature and equals size_bytes plus the
        16-byte AEAD tag, so a body of any other length fails authentication at
        the bucket and no object lands. PUT rather than POST because Oracle's S3
        Compatibility API does not implement POST Object.
      required: [url, method, expires_at, headers]
      properties:
        url:
          type: string
        method:
          type: string
          enum: [PUT]
        expires_at:
          type: string
          format: date-time
        headers:
          type: object
          description: >
            Signed request headers. The client echoes each one except
            Content-Length, which browsers forbid setting and derive from the
            request body — which is exactly the signed value.
          additionalProperties:
            type: string
    FinalizeSecretResponse:
      type: object
      additionalProperties: false
      required: [id, finalized]
      properties:
        id:
          type: string
        finalized:
          type: boolean
    AccessVerifier:
      type: object
      additionalProperties: false
      description: Model A only. When present on a create request, both fields are required.
      required: [kdf, proof]
      properties:
        kdf:
          $ref: "#/components/schemas/KdfParams"
        proof:
          type: string
          description: Base64-encoded client-derived access proof (Model A only).
    AccessMetadata:
      type: object
      additionalProperties: false
      required: [kdf]
      properties:
        kdf:
          $ref: "#/components/schemas/KdfParams"
    GetSecretMetadataResponse:
      type: object
      additionalProperties: false
      description: |
        The `access` block is present only for Model A secrets, so the browser
        can derive the access proof. Model B secrets omit it; the browser opens
        using the URL fragment key without a proof.
      required:
        - id
        - kind
        - size_bytes
        - expires_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [text, file]
        access:
          $ref: "#/components/schemas/AccessMetadata"
        size_bytes:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
    OpenSecretRequest:
      type: object
      additionalProperties: false
      description: |
        Model A requires `access_proof` (derived from user input and metadata
        access KDF). Model B omits it; the link is the capability.
      required: []
      properties:
        access_proof:
          type: string
          description: Base64-encoded proof derived from local user input and metadata access KDF. Required for Model A, omitted for Model B.
    OpenSecretResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - ciphertext
        - nonce
        - size_bytes
        - expires_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [text, file]
        ciphertext:
          type: string
          description: Base64-encoded encrypted payload.
        nonce:
          type: string
          description: Base64-encoded AES-GCM nonce.
        kdf:
          $ref: "#/components/schemas/KdfParams"
          description: Present only for Model A secrets. Omitted for Model B; the browser decrypts with the URL fragment key.
        encrypted_filename:
          type: string
          description: Browser-encrypted JSON envelope containing filename metadata.
        content_type:
          type: string
          description: Media type for file download, or application/octet-stream.
        size_bytes:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
    KdfParams:
      type: object
      additionalProperties: false
      required:
        - algorithm
        - salt
        - iterations
        - key_length_bits
      properties:
        algorithm:
          type: string
          enum: [PBKDF2-SHA-256]
        salt:
          type: string
          description: Base64-encoded random KDF salt.
        iterations:
          type: integer
          minimum: 600000
        key_length_bits:
          type: integer
          enum: [256]
    CleanupSecretRequest:
      type: object
      additionalProperties: false
      required: [job_id, reason]
      properties:
        job_id:
          type: string
          minLength: 1
        reason:
          type: string
          enum: [consumed, expired, orphan, manual, retry]
    CleanupSecretResponse:
      type: object
      additionalProperties: false
      required: [id, cleaned]
      properties:
        id:
          type: string
        cleaned:
          type: boolean
