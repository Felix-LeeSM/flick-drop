services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: flick
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/dev/postgres-init.sql:/docker-entrypoint-initdb.d/10-flick-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Never ciphertext; --save "" --appendonly no keeps it off disk (security-model.md).
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.14.2-alpine
    command:
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  # minio/minio left Docker Hub and quay.io rejects anonymous pulls; this last community image bundles mc.
  minio:
    image: bitnamilegacy/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/bitnami/minio/data

  createbuckets:
    image: bitnamilegacy/minio:latest
    depends_on:
      - minio
    environment:
      MC_HOST_flick: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
      until /opt/bitnami/minio-client/bin/mc mb --ignore-existing flick/flick-dev; do echo waiting for minio; sleep 1; done;
      echo bucket ready;
      exit 0;
      "

volumes:
  nats-data:
  minio-data:
  postgres-data:
