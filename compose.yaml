services:
  nats:
    image: nats:2.14.2-alpine
    command:
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  # MinIO pulled its own images in 2025: minio/minio and minio/mc are gone from
  # Docker Hub and quay.io rejects anonymous pulls, so the dev stack runs the
  # last community image, which bundles the mc client for bucket provisioning.
  minio:
    image: bitnamilegacy/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/bitnami/minio/data

  # One-shot bucket provisioner: waits for MinIO, then creates the dev bucket.
  createbuckets:
    image: bitnamilegacy/minio:latest
    depends_on:
      - minio
    environment:
      MC_HOST_flick: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
      until /opt/bitnami/minio-client/bin/mc mb --ignore-existing flick/flick-dev; do echo waiting for minio; sleep 1; done;
      echo bucket ready;
      exit 0;
      "

volumes:
  nats-data:
  minio-data:
