name: Release CLI

# Tagged cli/v* only. Server images publish on v* tags
# (.github/workflows/publish-images.yml); keeping the namespaces apart means a
# CLI release never republishes flick-api, flick-worker, and flick-web.
on:
  push:
    tags:
      - "cli/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing cli/v* tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish flick binaries
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history so the tag can be proved an ancestor of the default
          # branch below; a shallow clone cannot answer that question.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted release source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Mirrors the trust check in publish-images.yml. A release asset is
          # something users download and run, so it must be built from a commit
          # that already went through review-gate on the default branch — not
          # from whatever commit someone happened to tag.
          case "$REF_NAME" in
            cli/v*) ;;
            *)
              echo "release-cli: $REF_NAME is not a cli/v* tag" >&2
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "release-cli: refusing to publish from a non-tag ref" >&2
            exit 1
          fi

          # A manual dispatch names a tag by string, so confirm the ref really
          # is a tag rather than a branch that happens to be named cli/v-...
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git rev-parse -q --verify "refs/tags/$REF_NAME" >/dev/null; then
              echo "release-cli: $REF_NAME is not an existing tag" >&2
              exit 1
            fi
          fi

          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "release-cli: $REF_NAME must point at a commit reachable from $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"

      - name: Run Go checks
        run: scripts/ci/go.sh

      - name: Build binaries
        shell: bash
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#cli/}"
          mkdir -p dist
          # CGO stays off: the CLI imports no sqlite driver, so every target
          # cross-compiles from this one runner with no C toolchain.
          export CGO_ENABLED=0
          while read -r goos goarch; do
            name="flick_${version}_${goos}_${goarch}"
            output="dist/${name}/flick"
            if [ "$goos" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "$output" ./cmd/flick
            tar -czf "dist/${name}.tar.gz" -C "dist/${name}" .
            rm -rf "dist/${name}"
          done <<'TARGETS'
          darwin arm64
          darwin amd64
          linux amd64
          linux arm64
          windows amd64
          TARGETS

          # Checksums are the only integrity signal on a downloaded binary, so
          # they ship alongside every release.
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#cli/}"
          gh release create "$REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "flick CLI $version" \
            --notes "Flick command-line client $version.

          Verify a download against \`SHA256SUMS\` before running it.

          Install with Go instead:

              go install github.com/Felix-LeeSM/flick-drop/cmd/flick@latest

          A \`cli/v*\` tag is not a Go module version, so it cannot be passed to
          \`go install\`. Pin a Go build to this release with its commit:

              go install github.com/Felix-LeeSM/flick-drop/cmd/flick@$GITHUB_SHA
          " \
            dist/*.tar.gz dist/SHA256SUMS
