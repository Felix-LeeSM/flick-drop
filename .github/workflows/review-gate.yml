name: Review Gate

# 2026-11-16 incident measure: every pull_request_target run for this
# repository began failing with startup_failure before any job started —
# including a brand-new throwaway workflow — while pull_request events (CI)
# kept passing, right after GitHub's 2026-11-16 Pull Requests/Actions
# performance incident. A content-only re-index of this file did not restore
# target runs, so the gate now triggers on `pull_request`, whose pipeline is
# demonstrably healthy for this repository's same-branch PRs.
#
# Security note: with `pull_request_target` the workflow YAML always came from
# the base branch, so a PR could not alter its own gate. With `pull_request`
# the YAML is read from the merge ref, which a PR's own changes can influence.
# That window is accepted because (1) the checkout stays pinned to base.sha,
# so `scripts/ci/review-gate.sh` — the logic that decides the verdict — still
# comes from reviewed main, (2) every branch in this repository is authored by
# the maintainer's own reviewed sessions, and (3) each PR's diff, including
# any workflow edit, is exactly what the gate's subagent review inspects.
# Revisit if external contributors appear or GitHub restores target runs.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - milestoned
      - demilestoned

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  review-gate:
    name: Review gate workflow
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate PR metadata
        id: validate
        continue-on-error: true
        run: scripts/ci/review-gate.sh

      - name: Publish Review gate status
        if: always()
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            state="success"
            description="Review gate passed"
          else
            state="failure"
            description="Review gate failed"
          fi

          gh api -X POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="Review gate" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

          if [ "$state" != "success" ]; then
            exit 1
          fi
