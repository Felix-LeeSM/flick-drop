[tools]
go = "1.25.11"
node = "24.15.0"
pnpm = "10.20.0"
direnv = "2.37.1"
sqlite = "3.53.2"
kubectl = "1.36.2"
kustomize = "5.8.1"
k3d = "5.9.0"

# Local development defaults, exported by direnv through .envrc. This file is
# committed, so it holds only placeholders and local-only credentials. Real
# values belong in .env.local, which is git-ignored and which direnv loads
# afterwards — so anything there wins over everything here.
[env]
FLICK_ENV = "development"
FLICK_LOG_LEVEL = "debug"

# Service addresses: web dev server on 5173, API on 8080.
FLICK_API_ADDR = ":8080"
FLICK_PUBLIC_BASE_URL = "http://localhost:5173"
FLICK_API_BASE_URL = "http://localhost:8080"
FLICK_INTERNAL_API_BASE_URL = "http://localhost:8080"

# PUBLIC_ prefix = baked into the browser bundle at build time. Size limits are
# deliberately not here: the browser fetches them from /api/config at runtime.
PUBLIC_FLICK_API_BASE_URL = "http://localhost:8080"

# Placeholders. Production values come from the GitHub `production` environment
# secrets; never write a real token into this file.
FLICK_INTERNAL_TOKEN = "change-me-local"
FLICK_METRICS_TOKEN = "change-me-metrics-local"

# NATS JetStream, started by `docker compose up -d nats`.
FLICK_NATS_URL = "nats://127.0.0.1:4222"
FLICK_NATS_STREAM = "FLICK_JOBS"
FLICK_NATS_JOB_SUBJECT = "flick.jobs"

# SQLite files under ./var (git-ignored).
FLICK_DATA_DIR = "./var"
FLICK_API_DB_PATH = "./var/api.db"
FLICK_WORKER_DB_PATH = "./var/worker.db"

# Payload routing. At or below the inline threshold the ciphertext is stored as
# an api.db BLOB; above it the large-object backend takes over. When that
# backend is disabled the server clamps the advertised ceiling down to the
# inline threshold, so /api/config never promises more than it will accept.
FLICK_PAYLOAD_INLINE_MAX_BYTES = "1048576" # 1 MiB
FLICK_MAX_FILE_BYTES = "52428800"          # 50 MiB

# FLICK_STORAGE_LARGE_BACKEND is deliberately absent. scripts/dev/up.sh defaults
# it to "s3" and starts MinIO; pinning it here would win over that default
# (mise exports before up.sh runs) and silently kill every upload over 1 MiB.
# Point at a different object store by setting it in .env.local instead.
FLICK_S3_ENDPOINT = "http://localhost:9000"
FLICK_S3_REGION = "us-east-1"
FLICK_S3_BUCKET = "flick-dev"
# MinIO's default local credentials (compose.yaml), not a secret.
FLICK_S3_ACCESS_KEY_ID = "minioadmin"
FLICK_S3_SECRET_ACCESS_KEY = "minioadmin"
# MinIO and OCI S3-compat both require path-style addressing.
FLICK_S3_PATH_STYLE = "true"

# Link lifetime bounds in seconds: 5 minutes to 7 days, default 1 hour.
FLICK_DEFAULT_TTL_SECONDS = "3600"
FLICK_MIN_TTL_SECONDS = "300"
FLICK_MAX_TTL_SECONDS = "604800"

# Per-client rate limits. Empty FLICK_TRUSTED_PROXIES means no proxy is trusted
# to set X-Forwarded-For, so the direct peer IP is used.
FLICK_OPEN_RATE_PER_MIN = "10"
FLICK_CREATE_RATE_PER_MIN = "5"
FLICK_TRUSTED_PROXIES = ""

FLICK_WORKER_CONCURRENCY = "2"

[tasks.doctor]
description = "Show pinned tool versions and the resolved Flick environment"
run = "mise current && mise env --redacted"

[tasks.check]
description = "Run local CI checks"
run = "scripts/ci/all.sh"

[tasks.images]
description = "Build local container images"
run = "scripts/ci/images.sh"

[tasks.manifests]
description = "Validate Kubernetes manifests"
run = "scripts/ci/k8s-manifests.sh"

[tasks.dev]
description = "Start local NATS, API, worker, and web dev servers"
run = "scripts/dev/up.sh"

[tasks.smoke-nats]
description = "Run the local NATS JetStream smoke test"
run = "scripts/ci/compose-nats-smoke.sh"

[tasks.smoke-k3d]
description = "Run the k3d smoke test when deploy manifests exist"
run = "scripts/ci/k3d-smoke.sh"

[tasks.nats-up]
description = "Start local NATS JetStream via compose"
run = "docker compose up -d nats"

[tasks.nats-down]
description = "Stop local NATS JetStream"
run = "docker compose down"
