# scripts/dev/postgres-init.sql is the local twin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  # ReadWriteOnce: the old pod must stop before the new one mounts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            # A fresh volume's root may hold lost+found, and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-db-admin
                  key: POSTGRES_PASSWORD
            # Read only on the first start of an empty volume; later changes do not change the roles.
            - name: FLICK_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-db-api
                  key: password
            - name: FLICK_WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-db-worker
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-init
          configMap:
            name: postgres-init
            # Executable, so the entrypoint runs it in its own shell instead of sourcing it.
            defaultMode: 0555
        - name: run
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # psql reads the passwords via \getenv, so they never appear here or in a process argument list.
  10-flick-init.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    \getenv api_password FLICK_API_DB_PASSWORD
    \getenv worker_password FLICK_WORKER_DB_PASSWORD
    create role flick_api login password :'api_password';
    create role flick_worker login password :'worker_password';
    create database flick_api owner flick_api;
    create database flick_worker owner flick_worker;
    revoke all on database flick_api from public;
    revoke all on database flick_worker from public;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flick-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flick-worker
      ports:
        - port: postgres
