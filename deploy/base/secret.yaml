apiVersion: v1
kind: Secret
metadata:
  name: flick-secrets
type: Opaque
stringData:
  FLICK_INTERNAL_TOKEN: "replace-me-before-use"
  FLICK_METRICS_TOKEN: "replace-me-before-use"
  FLICK_RATELIMIT_KEY_SALT: "replace-me-before-use"
---
# Use URL-safe passwords (e.g. `openssl rand -hex 24`): each is placed in a postgres:// URL as is.
apiVersion: v1
kind: Secret
metadata:
  name: flick-db-api
type: Opaque
stringData:
  password: "replace-me-before-use"
---
apiVersion: v1
kind: Secret
metadata:
  name: flick-db-worker
type: Opaque
stringData:
  password: "replace-me-before-use"
---
# No Flick process uses it.
apiVersion: v1
kind: Secret
metadata:
  name: flick-db-admin
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-me-before-use"
