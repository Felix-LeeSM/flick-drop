apiVersion: v1
kind: Secret
metadata:
  name: flick-secrets
type: Opaque
stringData:
  FLICK_INTERNAL_TOKEN: "replace-me-before-use"
  FLICK_METRICS_TOKEN: "replace-me-before-use"
  # Only an empty value disables /api/stats (it then answers 404): any
  # non-empty string becomes a working credential, so replace this
  # placeholder with a real token before the base manifests are used as-is.
  FLICK_STATS_TOKEN: "replace-me-before-use"
