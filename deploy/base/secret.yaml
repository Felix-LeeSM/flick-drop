apiVersion: v1
kind: Secret
metadata:
  name: flick-secrets
type: Opaque
stringData:
  FLICK_INTERNAL_TOKEN: "replace-me-before-use"
  FLICK_METRICS_TOKEN: "replace-me-before-use"
  # HMAC salt for Valkey keys (rate-limit buckets, live-transfer room IDs).
  FLICK_RATELIMIT_KEY_SALT: "replace-me-before-use"
---
# Database credentials are split per role: flick-api reads only
# Secret/flick-db-api, flick-worker only Secret/flick-db-worker, and each pod
# builds its DSN from its own password (deploy/base/api.yaml,
# deploy/base/worker.yaml). Use URL-safe passwords (for example
# `openssl rand -hex 24`): the password is placed in a postgres:// URL as is.
# The postgres pod reads both once, to create the roles on an empty volume.
apiVersion: v1
kind: Secret
metadata:
  name: flick-db-api
type: Opaque
stringData:
  password: "replace-me-before-use"
---
apiVersion: v1
kind: Secret
metadata:
  name: flick-db-worker
type: Opaque
stringData:
  password: "replace-me-before-use"
---
# Superuser password of the postgres pod. No Flick process uses it.
apiVersion: v1
kind: Secret
metadata:
  name: flick-db-admin
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-me-before-use"
