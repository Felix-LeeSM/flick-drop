apiVersion: v1
kind: Secret
metadata:
  name: flick-secrets
type: Opaque
stringData:
  FLICK_INTERNAL_TOKEN: "replace-me-before-use"
  FLICK_METRICS_TOKEN: "replace-me-before-use"
  # Empty or placeholder value keeps /api/stats answering 404; set a real
  # token to enable the admin usage report.
  FLICK_STATS_TOKEN: "replace-me-before-use"
