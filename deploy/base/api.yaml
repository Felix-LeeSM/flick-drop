apiVersion: apps/v1
kind: Deployment
metadata:
  name: flick-api
spec:
  replicas: 2
  # maxSurge 0: never more than two API pods during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flick-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flick-api
    spec:
      automountServiceAccountToken: false
      # 5 s preStop + up to the 50 s shutdownTimeout in cmd/flick-api/main.go for live streams.
      terminationGracePeriodSeconds: 60
      # The base stays node-agnostic; a private overlay adds node affinity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flick-api
      securityContext:
        fsGroup: 100
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/example/flick-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flick-config
            - secretRef:
                name: flick-secrets
          env:
            - name: FLICK_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-db-api
                  key: password
            - name: FLICK_DATABASE_URL
              value: "postgres://flick_api:$(FLICK_API_DB_PASSWORD)@postgres:5432/flick_api?sslmode=disable"
            - name: FLICK_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8080
            - name: stream
              containerPort: 8081
          lifecycle:
            # Endpoints drop this pod before SIGTERM arrives.
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # The default 1s expires on a loaded 1-vCPU node and crashloops healthy pods (observed in prod).
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            # Request finalize spools (two ~256 MiB objects); keep sizeLimit >= 2 x age size of FLICK_MAX_FILE_BYTES.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 600Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flick-api
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: flick-flick-backends@kubernetescrd
spec:
  selector:
    app.kubernetes.io/name: flick-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Headless: VictoriaMetrics scrapes each replica via dns_sd_configs, not one random pod.
apiVersion: v1
kind: Service
metadata:
  name: flick-api-headless
  labels:
    app.kubernetes.io/name: flick-api
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: flick-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The stream listener (8081) accepts only other flick-api pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flick-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flick-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flick-api
      ports:
        - port: stream
