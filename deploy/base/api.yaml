apiVersion: apps/v1
kind: Deployment
metadata:
  name: flick-api
spec:
  # Two replicas share every piece of state through Postgres, NATS, and Valkey
  # (docs/architecture/deployment-target.md, "Scaling Boundaries").
  replicas: 2
  # maxSurge 0: a rollout stops one old pod before it starts a new one, so the
  # namespace never runs more than two API pods. Which node a pod lands on is
  # up to the soft spread below and the deployment's own node pinning.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flick-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flick-api
    spec:
      automountServiceAccountToken: false
      # Shutdown budget: 5-second preStop, then SIGTERM and up to the
      # 50-second shutdownTimeout in cmd/flick-api/main.go for /send,
      # /receive, and pod-to-pod stream hops still running.
      terminationGracePeriodSeconds: 60
      # Prefer one replica per node. A private overlay adds node affinity for
      # a specific cluster; the base stays node-agnostic.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flick-api
      securityContext:
        fsGroup: 100
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/example/flick-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flick-config
            - secretRef:
                name: flick-secrets
          env:
            - name: FLICK_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-db-api
                  key: password
            - name: FLICK_DATABASE_URL
              value: "postgres://flick_api:$(FLICK_API_DB_PASSWORD)@postgres:5432/flick_api?sslmode=disable"
            # The address this replica advertises to the others for
            # live-transfer stream hops (internal/piperelay/stream.go).
            - name: FLICK_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8080
            - name: stream
              containerPort: 8081
          lifecycle:
            # Endpoints drop this pod before SIGTERM arrives, so no new
            # request lands on a replica that is shutting down.
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # On a loaded 1-vCPU node the default 1s timeout expires before the
            # handler responds; the kubelet then SIGTERMs a healthy pod into a
            # crashloop (observed in prod). 5s tolerates transient CPU steal.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            # Request finalize spools (internal/requests maxCopies: two objects
            # of about 256 MiB each) live here, not on the node's root layer.
            # Keep sizeLimit >= 2 x the age size of FLICK_MAX_FILE_BYTES.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 600Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flick-api
spec:
  selector:
    app.kubernetes.io/name: flick-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Headless twin of flick-api: its A record returns every API pod IP, so
# VictoriaMetrics scrapes each replica's /metrics through dns_sd_configs
# (deploy/base/monitoring/vmsingle.yaml) instead of one random pod behind the
# ClusterIP. Cluster-internal only, like flick-api.
apiVersion: v1
kind: Service
metadata:
  name: flick-api-headless
  labels:
    app.kubernetes.io/name: flick-api
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: flick-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The live-transfer stream listener (port 8081) accepts only other flick-api
# pods; the public API port stays open to the ingress and the scraper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flick-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flick-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flick-api
      ports:
        - port: stream
