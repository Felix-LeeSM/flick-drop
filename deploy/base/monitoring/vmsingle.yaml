# Scrapes via static DNS / dns_sd (headless Services for per-replica targets), so it needs no RBAC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-scrape
data:
  scrape.yml: |
    global:
      scrape_interval: 30s
      external_labels:
        cluster: flick
    scrape_configs:
      # vmsingle self-metrics.
      - job_name: vmsingle
        static_configs:
          - targets: ['127.0.0.1:8428']

      # flick API /metrics is bearer-guarded (FLICK_METRICS_TOKEN); the token is
      # mounted from the flick-secrets Secret. Fails the scrape (401) if the
      # mounted token does not match the API's. Every replica is scraped
      # (instance = pod IP); its counters are per replica and sum() across
      # them, while the database-backed gauges (flick_active_uploads,
      # flick_outbox_pending, flick_storage_bytes_used) repeat one cluster-wide
      # value per replica and aggregate with max().
      - job_name: flick-api
        metrics_path: /metrics
        bearer_token_file: /etc/vm-secrets/flick-metrics-token
        dns_sd_configs:
          - names: ['flick-api-headless.flick.svc.cluster.local']
            type: A
            port: 8080

      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics:8080']

      # Worker /metrics (flick_jobs_processed_total, the queue-facing series).
      # Same bearer credential as the API.
      - job_name: flick-worker
        metrics_path: /metrics
        bearer_token_file: /etc/vm-secrets/flick-metrics-token
        dns_sd_configs:
          - names: ['flick-worker-metrics-headless.flick.svc.cluster.local']
            type: A
            port: 9091

      # Headless Service: the A record returns all node-exporter pod IPs, so
      # every node is scraped without hostNetwork (node-IP:9100 is firewalled
      # cross-node on this cluster). FQDN is required — dns_sd does not append
      # search domains. Assumes the flick namespace (matches the kustomization).
      - job_name: node-exporter
        dns_sd_configs:
          - names: ['node-exporter.flick.svc.cluster.local']
            type: A
            port: 9100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmsingle-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmsingle
spec:
  replicas: 1
  # Recreate: the PVC is ReadWriteOnce, so a second pod cannot mount it during termination.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmsingle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup makes the PVC and token file readable by the non-root user; the scratch image has no user.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.111.0
          imagePullPolicy: IfNotPresent
          args:
            - --storageDataPath=/storage
            - --retentionPeriod=14d
            - --promscrape.config=/etc/vm/scrape.yml
            - --httpListenAddr=:8428
            - --memory.allowedPercent=70
          ports:
            - name: http
              containerPort: 8428
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            # The default 1s timeout trips on a GC pause and crash-loops the pod.
            timeoutSeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
          # --memory.allowedPercent caps actual use below the limit on the ~1GB edge node.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: scrape
              mountPath: /etc/vm
              readOnly: true
            - name: token
              mountPath: /etc/vm-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: vmsingle-data
        - name: scrape
          configMap:
            name: vmsingle-scrape
        - name: token
          secret:
            secretName: flick-secrets
            items:
              - key: FLICK_METRICS_TOKEN
                path: flick-metrics-token
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle
spec:
  selector:
    app.kubernetes.io/name: vmsingle
  ports:
    - name: http
      port: 8428
      targetPort: http
