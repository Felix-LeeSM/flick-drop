# Grafana: the admin's single observability view (usage counters, queue
# health, node/pod status, access-log search). Not part of the public product
# surface: the ingress host is a placeholder (grafana.localhost) that the ops
# overlay replaces with grafana.<domain> plus cert-manager TLS, and login is
# Grafana's own admin credential — anonymous access is disabled here, so a
# deployed Grafana behind a not-yet-patched placeholder host can still only be
# opened with the admin password.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
type: Opaque
stringData:
  # Ops overlay replaces both before use; the password must be strong because
  # the ingress is internet-facing once patched.
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "replace-me-before-use"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: vmsingle
        type: prometheus
        access: proxy
        url: http://vmsingle:8428
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: flick
        folder: Flick
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  usage.json: |
    {
      "uid": "flick-usage",
      "title": "Flick 사용량·큐·접속",
      "tags": ["flick"],
      "timezone": "utc",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": { "list": [
        { "name": "window", "label": "버킷", "type": "custom", "hide": 0,
          "query": "1분 : 1m,15분 : 15m,1시간 : 1h,1일 : 1d",
          "current": { "selected": true, "text": "1시간", "value": "1h" },
          "options": [
            { "selected": false, "text": "1분", "value": "1m" },
            { "selected": false, "text": "15분", "value": "15m" },
            { "selected": true, "text": "1시간", "value": "1h" },
            { "selected": false, "text": "1일", "value": "1d" }
          ] }
      ] },
      "links": [
        { "title": "오늘(UTC 00:00부터)", "type": "link", "icon": "clock",
          "url": "/d/flick-usage?from=now/d&to=now/d" }
      ],
      "panels": [
        { "type": "timeseries", "title": "전달 생성 (${window:text})", "interval": "$window", "datasource": "vmsingle", "gridPos": {"x": 0, "y": 0, "w": 8, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 80, "lineWidth": 0}}, "overrides": []},
          "targets": [{"expr": "sum by (kind) (increase(flick_secret_created_total[$window]))", "legendFormat": "{{kind}}"}] },
        { "type": "timeseries", "title": "열람 (${window:text})", "interval": "$window", "datasource": "vmsingle", "gridPos": {"x": 8, "y": 0, "w": 8, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 80, "lineWidth": 0}}, "overrides": []},
          "targets": [{"expr": "sum(increase(flick_secret_opened_total[$window]))", "legendFormat": "열람"}] },
        { "type": "timeseries", "title": "요청 링크 (${window:text})", "interval": "$window", "datasource": "vmsingle", "gridPos": {"x": 16, "y": 0, "w": 8, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 80, "lineWidth": 0}}, "overrides": []},
          "targets": [
            {"expr": "sum(increase(flick_request_created_total[$window]))", "legendFormat": "생성"},
            {"expr": "sum(increase(flick_request_submitted_total[$window]))", "legendFormat": "작성됨"},
            {"expr": "sum(increase(flick_request_consumed_total[$window]))", "legendFormat": "열람"}
          ] },
        { "type": "stat", "title": "저장된(암호화된) 바이트", "datasource": "vmsingle", "gridPos": {"x": 0, "y": 8, "w": 8, "h": 4},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "targets": [{"expr": "flick_storage_bytes_used", "legendFormat": "{{storage}}"}] },
        { "type": "stat", "title": "진행 중인 대용량 업로드", "datasource": "vmsingle", "gridPos": {"x": 8, "y": 8, "w": 4, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [{"expr": "sum(flick_active_uploads)", "legendFormat": "진행 중"}] },
        { "type": "stat", "title": "실행 중인 프로세스", "datasource": "vmsingle", "gridPos": {"x": 12, "y": 8, "w": 4, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "targets": [{"expr": "sum(up{job=~\"flick-api|flick-worker\"})", "legendFormat": "실행 중"}] },
        { "type": "timeseries", "title": "파드 단계별 수(flick)", "datasource": "vmsingle", "gridPos": {"x": 16, "y": 8, "w": 8, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [{"expr": "sum by (phase) (kube_pod_status_phase{namespace=\"flick\"})", "legendFormat": "{{phase}}"}] },

        { "type": "timeseries", "title": "outbox 백로그(발행 대기)", "datasource": "vmsingle", "gridPos": {"x": 0, "y": 12, "w": 8, "h": 8},
          "description": "늘어나면 NATS 브로커가 밀리거나 죽었다는 뜻이고, 0이 정상 상태입니다.",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [{"expr": "flick_outbox_pending", "legendFormat": "대기"}] },
        { "type": "timeseries", "title": "outbox 발행, 분당", "datasource": "vmsingle", "gridPos": {"x": 8, "y": 12, "w": 8, "h": 8},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "targets": [{"expr": "sum by (outcome) (rate(flick_outbox_published_total[5m])) * 60", "legendFormat": "{{outcome}}"}] },
        { "type": "timeseries", "title": "worker 작업, 분당", "datasource": "vmsingle", "gridPos": {"x": 16, "y": 12, "w": 8, "h": 8},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "targets": [{"expr": "sum by (outcome) (rate(flick_jobs_processed_total[5m])) * 60", "legendFormat": "{{outcome}}"}] },

        { "type": "timeseries", "title": "상태코드별 요청, 분당(traefik 접속 로그)", "datasource": "loki", "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
          "description": "traefik 접속 로그입니다(ops 오버레이에서 JSON 형식으로 내보냅니다).",
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [{"expr": "sum by (DownstreamStatus) (rate({namespace=\"kube-system\", app=\"traefik\"} | json [2m]))", "legendFormat": "{{DownstreamStatus}}"}] },
        { "type": "timeseries", "title": "최근 1시간 인기 경로", "datasource": "loki", "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [{"expr": "topk(10, sum by (RequestPath) (count_over_time({namespace=\"kube-system\", app=\"traefik\"} | json [1h])))", "legendFormat": "{{RequestPath}}"}] },
        { "type": "table", "title": "최근 하루 고유 클라이언트 IP", "datasource": "loki", "gridPos": {"x": 0, "y": 28, "w": 24, "h": 8},
          "targets": [{"expr": "count by (ClientHost) (count_over_time({namespace=\"kube-system\", app=\"traefik\"} | json [1d]))", "instant": true, "format": "table"}],
          "transformations": [{"id": "organize", "options": {"renameByName": {"ClientHost": "클라이언트 IP", "Value": "요청 수"}}}] },

        { "type": "timeseries", "title": "앱 에러, 분당", "datasource": "loki", "gridPos": {"x": 0, "y": 36, "w": 12, "h": 8},
          "description": "flick-api와 flick-worker가 남기는 JSON 구조화 slog ERROR 기록입니다.",
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "targets": [{"expr": "sum by (app) (rate({namespace=\"flick\"} | json | level=\"ERROR\" [5m])) * 60", "legendFormat": "{{app}}"}] },
        { "type": "timeseries", "title": "실패한 요청 4xx/5xx, 분당(traefik)", "datasource": "loki", "gridPos": {"x": 12, "y": 36, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [{"expr": "sum by (DownstreamStatus) (rate({namespace=\"kube-system\", app=\"traefik\"} | json | DownstreamStatus =~ \"[45]..\" [5m])) * 60", "legendFormat": "{{DownstreamStatus}}"}] },
        { "type": "logs", "title": "최근 에러 로그", "datasource": "loki", "gridPos": {"x": 0, "y": 44, "w": 24, "h": 12},
          "description": "앱 ERROR 원문입니다(아래가 최신). 시간 범위를 바꾸거나 Explore에서 전문 검색하세요.",
          "targets": [{"expr": "{namespace=\"flick\"} | json | level=\"ERROR\"", "refId": "A"}] }
      ]
    }
  cluster.json: |
    {
      "uid": "flick-cluster",
      "title": "Flick \ud074\ub7ec\uc2a4\ud130: \ub178\ub4dc\uc640 \ud30c\ub4dc",
      "tags": ["flick"],
      "timezone": "utc",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "type": "stat",
          "title": "다운된 노드",
          "datasource": "vmsingle",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "description": "Ready 상태가 아닌 노드 수입니다. kube-state-metrics가 수집한 노드 Ready 조건(kube_node_status_condition)으로 셉니다.",
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "targets": [{"expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 0) or vector(0)"}]
        },
        {
          "type": "stat",
          "title": "실행 중인 파드",
          "datasource": "vmsingle",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})"}]
        },
        {
          "type": "stat",
          "title": "실행 중이 아닌 파드",
          "datasource": "vmsingle",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "description": "모든 네임스페이스에서 Pending, Failed, Unknown 상태인 파드 수입니다.",
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"}) or vector(0)"}]
        },
        {
          "type": "stat",
          "title": "컨테이너 재시작(최근 24시간)",
          "datasource": "vmsingle",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total[1d]))"}]
        },
        {
          "type": "timeseries",
          "title": "컨테이너별 실제 메모리",
          "datasource": "vmsingle",
          "gridPos": {"x": 0, "y": 74, "w": 12, "h": 9},
          "description": "컨테이너가 지금 실제로 쓰는 메모리(working set)입니다. kubelet의 cAdvisor에서 수집하며, 위 지도의 타일 면적(메모리 요청량)과 달리 실사용량입니다.",
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull"], "sortBy": "Last *", "sortDesc": true}},
          "targets": [{"expr": "sum by (node, namespace, pod, container) (container_memory_working_set_bytes{job=\"cadvisor\", container!=\"\"})", "legendFormat": "{{namespace}}/{{container}} ({{node}})"}]
        },
        {
          "type": "timeseries",
          "title": "컨테이너별 CPU 사용량",
          "datasource": "vmsingle",
          "gridPos": {"x": 12, "y": 74, "w": 12, "h": 9},
          "description": "컨테이너의 CPU 사용량을 5분 평균으로 보여 줍니다. 1은 CPU 코어 1개를 꽉 쓴 상태입니다. kubelet의 cAdvisor에서 수집합니다.",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull"], "sortBy": "Last *", "sortDesc": true}},
          "targets": [{"expr": "sum by (node, namespace, pod, container) (rate(container_cpu_usage_seconds_total{job=\"cadvisor\", container!=\"\"}[5m]))", "legendFormat": "{{namespace}}/{{container}} ({{node}})"}]
        },
        {
          "type": "text",
          "title": "노드·네임스페이스·파드 읽는 법",
          "gridPos": {"x": 0, "y": 83, "w": 24, "h": 7},
          "options": {"mode": "markdown", "content": "**노드(Node)** — 클러스터를 이루는 한 대의 머신(VM)입니다. 아래 노드 표에서 메모리와 디스크의 남은 양·총량·여유 비율, 유휴 CPU, 스왑 사용량을 볼 수 있습니다. 노드 이름은 데이터에서 가져오므로 이 대시보드는 특정 배포에 묶여 있지 않습니다.\n\n**어디에 무엇이 도나** — treemap은 노드 안에 네임스페이스, 그 안에 파드, 그 안에 컨테이너를 중첩해 보여 줍니다. 타일 면적은 컨테이너의 메모리 요청량이고, 타일에 마우스를 올리면 이 컨테이너가 무슨 일을 하는지 볼 수 있습니다.\n\n**네임스페이스(Namespace)** — 파드를 묶는 이름 공간입니다. `flick`는 앱과 관측 스택, `kube-system`은 k3s 코어, `cert-manager`는 TLS 인증서 자동화입니다.\n\n**파드(Pod)** — 구성요소 하나가 스케줄되는 단위이며, 노드와 네트워크를 공유하는 하나 이상의 컨테이너를 묶습니다. 파드 이름은 임의 접미사로 끝나고, 그 앞부분이 구성요소 이름입니다(아래 표의 *하는 일* 열 참고).\n\n**컨테이너(Container)** — 파드 안에서 실제로 도는 프로세스입니다. 지금은 모든 파드에 컨테이너가 하나씩 있고, 사이드카가 생기면 같은 파드 상자 안에 타일이 하나 더 생깁니다.\n\n**단계(Phase)** — Running이 정상입니다. Pending(노드나 이미지 대기), Failed, Unknown은 빨간색으로 표시됩니다. **재시작**은 파드가 시작된 이후의 컨테이너 재시작 횟수이고, 늘어나면 크래시 루프입니다.\n\n**다운된 노드**는 Ready 상태가 아닌 노드 수입니다. kube-state-metrics가 수집한 노드 Ready 조건으로 셉니다."}
        },
        {
          "type": "table",
          "title": "노드",
          "datasource": "vmsingle",
          "gridPos": {"x": 0, "y": 22, "w": 24, "h": 6},
          "description": "노드마다 한 줄입니다. 메모리와 디스크는 남은 양·총량·여유 비율을 함께 보여 줍니다. 노드 이름은 node-exporter 파드 IP를 kube_pod_info와 연결해 만듭니다.",
          "targets": [{"expr": "count by (node) (kube_pod_info)", "instant": true, "format": "table", "refId": "A"}, {"expr": "sum by (node) ((node_memory_MemAvailable_bytes) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "B"}, {"expr": "sum by (node) ((node_memory_MemTotal_bytes) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "C"}, {"expr": "sum by (node) ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "D"}, {"expr": "sum by (node) ((node_filesystem_avail_bytes{mountpoint=\"/\"}) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "E"}, {"expr": "sum by (node) ((node_filesystem_size_bytes{mountpoint=\"/\"}) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "F"}, {"expr": "sum by (node) ((node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "G"}, {"expr": "sum by (node) ((avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "H"}, {"expr": "sum by (node) ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) * on (instance) group_left (node) label_replace(kube_pod_info{pod=~\"node-exporter-.*\"}, \"instance\", \"${1}:9100\", \"pod_ip\", \"(.*)\"))", "instant": true, "format": "table", "refId": "I"}],
          "transformations": [{"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"node": 0, "Value #A": 1, "Value #B": 2, "Value #C": 3, "Value #D": 4, "Value #E": 5, "Value #F": 6, "Value #G": 7, "Value #H": 8, "Value #I": 9}, "renameByName": {"node": "노드", "Value #A": "파드 수", "Value #B": "메모리 여유", "Value #C": "메모리 총량", "Value #D": "메모리 여유 %", "Value #E": "디스크 여유", "Value #F": "디스크 총량", "Value #G": "디스크 여유 %", "Value #H": "CPU 유휴 %", "Value #I": "스왑 사용량"}}}],
