# Grafana Alloy DaemonSet: tails container logs through the Kubernetes API
# (loki.source.kubernetes streams pods/log — no privileges, no root, no node
# filesystem access) and ships the lines to Loki. Each replica only discovers
# pods on its own node (spec.nodeName field selector), so a 2-node cluster
# stores each line exactly once. Keeps only the flick namespace, the
# cert-manager namespace (TLS renewal failures), and the kube-system traefik pod — traefik's access log is the cluster's entry-point
# record (client IP, path, status), which is exactly the access-log search the
# admin needs; every other namespace's logs stay on their containers.
#
# Traefik access logging itself is enabled node-side (ops overlay), so until
# that lands only flick app containers appear here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-pod-logs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # loki.source.kubernetes streams the pods/log subresource (GET .../pods/{name}/log);
  # a "pods" rule alone does not cover it, and without this rule every log
  # request 403s while discovery and probes stay green.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-pod-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: flick
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"

      // DaemonSet replicas must not tail the whole cluster: without this field
      // selector every replica discovers every pod and each log line lands in
      // Loki once per node.
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // Keep the logs this deployment cares about: flick workloads, cert-manager
      // (a failed certificate renewal surfaces here first; it logs only on
      // renewal, so the volume is near zero), and the edge traefik (whose access
      // log is the cluster's entry-point record).
      // One keep with an RE2-safe alternation on "namespace/pod-name" — RE2
      // has no lookahead, so negative filtering is not an option here.
      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        regex         = "flick/.*|cert-manager/.*|kube-system/traefik.*"
      }

      // Standard labels Loki queries group by.
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.private.receiver]
    }

    // Every line passes through here before Loki, always: delivery IDs and IP
    // addresses become <id> and <ip>. The sources already leave them out
    // (web/nginx.conf flick_private, the traefik ClientHost/ClientAddr drops in
    // the ops bootstrap), so this is the safety net for anything that still
    // carries one: a traefik RequestPath, an nginx error line ("client: ..."),
    // an error text naming an object key. Time, method, path pattern, status,
    // and User-Agent stay. Not configurable on purpose: see
    // docs/architecture/security-model.md (Logs).
    loki.process "private" {
      forward_to = [loki.write.loki.receiver]

      // Delivery IDs in web and API paths and in object keys.
      stage.replace {
        expression = "(?:/(?:s|m|r|api/secrets|api/requests|api/v1/secrets|api/v1/requests)/|managed/(?:secrets|requests)/)([^/?\"<\\s]+)"
        replace    = "<id>"
      }
      // IPv4. The excluded preceding characters keep version numbers such as
      // Chrome/120.0.6099.109 in a User-Agent intact.
      stage.replace {
        expression = "(?:^|[^\\w./-])((?:\\d{1,3}\\.){3}\\d{1,3})"
        replace    = "<ip>"
      }
      // IPv6: eight groups, or a "::" form (also ::ffff:<ip> once IPv4 is
      // masked). Clock times such as 01:42:53 have neither, so they stay.
      stage.replace {
        expression = "(?:^|[^\\w./:-])((?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,7}:(?:[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4}){0,6})?|::[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4}){0,6}(?::<ip>)?)"
        replace    = "<ip>"
      }
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.21.3
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            # The default HTTP listen address is 127.0.0.1, which the readiness
            # probe (dialing the pod IP) cannot reach — pods stay NotReady and
            # the rollout wedges.
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: storage
          emptyDir:
            sizeLimit: 128Mi
