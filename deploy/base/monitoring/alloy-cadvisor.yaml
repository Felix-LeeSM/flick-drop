# hostNetwork: the node firewall drops pod-network traffic to kubelet :10250 (measured 2026-11-11), and
# the API-server proxy path needs nodes/proxy, which also allows kubelet exec. HTTP stays on 127.0.0.1
# so the debug UI is not published on the node IP; hence no HTTP probes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-cadvisor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-cadvisor
rules:
  # Unlike nodes/proxy, nodes/metrics does not authorize exec, logs, or pod listings.
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-cadvisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-cadvisor
subjects:
  - kind: ServiceAccount
    name: alloy-cadvisor
    namespace: flick
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-cadvisor-config
data:
  config.alloy: |
    prometheus.scrape "cadvisor" {
      job_name        = "cadvisor"
      targets         = [{"__address__" = sys.env("HOST_IP") + ":10250", "node" = sys.env("NODE_NAME")}]
      scheme          = "https"
      metrics_path    = "/metrics/cadvisor"
      scrape_interval = "30s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      // The k3s kubelet serves a self-signed certificate; the connection never
      // leaves the node (hostNetwork to the node's own IP).
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.relabel.cadvisor.receiver]
    }

    prometheus.relabel "cadvisor" {
      // Only the two series the cluster dashboard reads; cAdvisor emits ~2000
      // lines per node otherwise.
      rule {
        action        = "keep"
        source_labels = ["__name__"]
        regex         = "container_memory_working_set_bytes|container_cpu_usage_seconds_total"
      }
      // container="" rows are pod-level cgroups and the pause sandbox.
      rule {
        action        = "drop"
        source_labels = ["container"]
        regex         = ""
      }
      // id and name are per-cgroup paths and containerd IDs: unique per restart.
      rule {
        action = "labeldrop"
        regex  = "id|name"
      }
      forward_to = [prometheus.remote_write.vmsingle.receiver]
    }

    prometheus.remote_write "vmsingle" {
      endpoint {
        url = "http://vmsingle.flick.svc.cluster.local:8428/api/v1/write"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-cadvisor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-cadvisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-cadvisor
    spec:
      serviceAccountName: alloy-cadvisor
      hostNetwork: true
      # hostNetwork defaults to the node's resolv.conf; keep cluster DNS for the vmsingle Service.
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.21.3
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            # 12346 avoids clashing with a future hostNetwork use of alloy's default 12345.
            - --server.http.listen-addr=127.0.0.1:12346
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Measured 39-96Mi working set per node after start (WAL replay, 2026-11-11).
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-cadvisor-config
        - name: storage
          emptyDir:
            sizeLimit: 64Mi
