apiVersion: apps/v1
kind: Deployment
metadata:
  name: flick-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flick-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flick-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 100
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: docker.io/example/flick-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flick-config
            - secretRef:
                name: flick-secrets
          env:
            - name: FLICK_WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-db-worker
                  key: password
            - name: FLICK_WORKER_DATABASE_URL
              value: "postgres://flick_worker:$(FLICK_WORKER_DB_PASSWORD)@postgres:5432/flick_worker?sslmode=disable"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 9091
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flick-worker-metrics
  labels:
    app.kubernetes.io/name: flick-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flick-worker
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
---
# Headless: VictoriaMetrics scrapes each worker via dns_sd_configs.
apiVersion: v1
kind: Service
metadata:
  name: flick-worker-metrics-headless
  labels:
    app.kubernetes.io/name: flick-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: flick-worker
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
