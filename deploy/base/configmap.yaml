apiVersion: v1
kind: ConfigMap
metadata:
  name: flick-config
data:
  FLICK_ENV: "production"
  FLICK_LOG_LEVEL: "info"
  FLICK_PUBLIC_BASE_URL: "http://flick.localhost"
  FLICK_INTERNAL_API_BASE_URL: "http://flick-api:8080"
  FLICK_API_ADDR: ":8080"
  # Database DSNs are not here: each pod builds its own from its role's
  # Secret (deploy/base/api.yaml, deploy/base/worker.yaml).
  FLICK_VALKEY_ADDR: "valkey:6379"
  # Live-transfer stream listener, dialed pod-to-pod by IP
  # (internal/piperelay/stream.go). The same on every replica.
  FLICK_INTERNAL_HTTP_PORT: "8081"
  FLICK_NATS_URL: "nats://nats:4222"
  FLICK_NATS_STREAM: "FLICK_JOBS"
  FLICK_NATS_JOB_SUBJECT: "flick.jobs"
  FLICK_PAYLOAD_INLINE_MAX_BYTES: "1048576"
  FLICK_MAX_FILE_BYTES: "268435456"
  FLICK_DEFAULT_TTL_SECONDS: "3600"
  FLICK_MIN_TTL_SECONDS: "300"
  FLICK_MAX_TTL_SECONDS: "604800"
  # Comma-separated object backend names; empty keeps every payload inline.
  # Each name needs FLICK_STORAGE_<NAME>_* settings (env-contract.md), with the
  # keys in a Secret.
  FLICK_STORAGE_BACKENDS: ""
  # Extra origins appended to the web CSP connect-src. Empty is correct while
  # object storage is disabled; a deployment that enables it must list every
  # FLICK_STORAGE_<NAME>_ENDPOINT origin so the browser's direct presigned
  # upload is not blocked.
  FLICK_CSP_CONNECT_SRC: ""
  FLICK_OPEN_RATE_PER_MIN: "10"
  FLICK_TRUSTED_PROXIES: ""
