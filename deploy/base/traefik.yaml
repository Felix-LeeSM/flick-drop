# A dead node's pods stay in endpoints ~50 s and drop packets, so: fresh connection per request with a
# 2 s dial timeout, then retry on the other replica. Traefik retries only when no request header reached
# the backend (no replay of POST, open-once, or streams); three attempts since round-robin may repeat the dead pod.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: flick-backends
spec:
  maxIdleConnsPerHost: -1
  forwardingTimeouts:
    dialTimeout: 2s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flick-retry
spec:
  retry:
    attempts: 3
