# Ingress-side failover for the two flick-api and flick-web replicas, using
# the Traefik bundled with k3s (traefik.io/v1alpha1 CRDs).
#
# When a node dies, its pods stay in the Service endpoints until Kubernetes
# marks the node NotReady (about 50 seconds). Packets to those pods are dropped,
# not refused, so without these settings every request Traefik sends there
# hangs: on a reused keep-alive connection until the client gives up, on a new
# connection for the default 30 s dial timeout.
#
# - ServersTransport/flick-backends opens a fresh connection per request
#   (maxIdleConnsPerHost: -1; an in-cluster connect takes about 1 ms) and gives
#   up dialing after 2 s.
# - Middleware/flick-retry then sends the request to the other replica. Traefik
#   retries only when no request header reached the backend, so a POST, an
#   open-once request, or a streaming live-transfer body is never replayed.
#
# Ingress and Service annotations reference these as
# "flick-<name>@kubernetescrd" (namespace "flick" from
# deploy/base/kustomization.yaml).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: flick-backends
spec:
  maxIdleConnsPerHost: -1
  forwardingTimeouts:
    dialTimeout: 2s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flick-retry
spec:
  retry:
    attempts: 2
