apiVersion: apps/v1
kind: Deployment
metadata:
  name: flick-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flick-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flick-web
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flick-web
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/example/flick-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: FLICK_CSP_CONNECT_SRC
              valueFrom:
                configMapKeyRef:
                  name: flick-config
                  key: FLICK_CSP_CONNECT_SRC
                  # Optional: an overlay replacing flick-config without this key must not cause CreateContainerConfigError.
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: flick-web
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: flick-flick-backends@kubernetescrd
spec:
  selector:
    app.kubernetes.io/name: flick-web
  ports:
    - name: http
      port: 8080
      targetPort: http
