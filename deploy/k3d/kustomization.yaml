apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flick

resources:
  - ../base

images:
  - name: docker.io/example/flick-api
    newName: flick-local/flick-api
    newTag: ci
  - name: docker.io/example/flick-worker
    newName: flick-local/flick-worker
    newTag: ci
  - name: docker.io/example/flick-web
    newName: flick-local/flick-web
    newTag: ci

patches:
  - target:
      kind: Secret
      name: flick-secrets
    patch: |-
      - op: replace
        path: /stringData/FLICK_INTERNAL_TOKEN
        value: k3d-smoke-internal-token
      - op: replace
        path: /stringData/FLICK_RATELIMIT_KEY_SALT
        value: k3d-smoke-ratelimit-salt
  # Disposable smoke-only passwords; URL-safe because each pod places its
  # password in a postgres:// DSN (deploy/base/secret.yaml).
  - target:
      kind: Secret
      name: flick-db-api
    patch: |-
      - op: replace
        path: /stringData/password
        value: k3dsmokeapi
  - target:
      kind: Secret
      name: flick-db-worker
    patch: |-
      - op: replace
        path: /stringData/password
        value: k3dsmokeworker
  - target:
      kind: Secret
      name: flick-db-admin
    patch: |-
      - op: replace
        path: /stringData/POSTGRES_PASSWORD
        value: k3dsmokeadmin
