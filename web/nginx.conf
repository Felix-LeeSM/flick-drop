worker_processes auto;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Index only known public documents. SPA fallback/private routes stay noindex,
	# including before JavaScript runs. Empty values omit the response header.
	map $uri $flick_robots {
		default "noindex, nofollow";
		/ "";
		/index.html "";
		~^/guides/(password-sharing|temporary-file-sharing)(/|/index.html)?$ "";
	}

	# Access log without client IPs, referrers, or delivery IDs. A line keeps the
	# time, method, path pattern, status, size, and User-Agent: enough to see
	# traffic and failures, not who opened which delivery. The IP and referrer are
	# left out entirely (a referrer can carry /s/{id}); delivery IDs in /s/, /m/,
	# and /r/ paths become <id>, and the query string is dropped. The path comes
	# from $request_uri because $uri turns into the SPA fallback (/200.html)
	# after try_files. Browsers never send the #fragment key or token. Not
	# configurable on purpose: see docs/architecture/security-model.md (Logs).
	map $request_uri $flick_request_path {
		~^(?<flick_path>[^?]*) $flick_path;
	}
	map $flick_request_path $flick_log_path {
		default $flick_request_path;
		~^/(?<flick_seg>s|m|r)/[^/]+(?<flick_rest>/.*)?$ /$flick_seg/<id>$flick_rest;
	}
	log_format flick_private '[$time_iso8601] "$request_method $flick_log_path $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
	access_log /dev/stdout flick_private;
	error_log /dev/stderr warn;

	sendfile on;
	keepalive_timeout 65;

	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	server {
		listen 8080;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;

		# Security response headers for the HTML app. nginx add_header inheritance
		# is replace-per-level, so they live at the server level and `location /`
		# (the HTML/SPA path) inherits them; a location that sets its own
		# add_header re-declares only what it still needs. HSTS is intentionally
		# absent — it belongs at the TLS-terminating ingress, not this plain :8080
		# pod (see docs/architecture/security-model.md).
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Robots-Tag $flick_robots always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		# The HTML entry point names the hashed asset bundles, so a cached copy pins
		# the browser to the previous deployment's JS and CSS — old UI against a
		# freshly deployed API. no-cache still stores the document; it only forces
		# revalidation, so an unchanged page costs one 304. This sits at the server
		# level rather than in `location /` because the only location that must not
		# inherit it, /_app/immutable/, already declares its own add_header block
		# and so discards the whole inherited set.
		add_header Cache-Control "no-cache" always;
		# Content-Security-Policy is rendered at container start by the nginx
		# envsubst entrypoint so connect-src can carry the deployment's object-store
		# origin (FLICK_CSP_CONNECT_SRC). The glob never errors when empty, so the
		# pod still starts if the template is removed. See nginx-templates/.
		include /etc/nginx/snippets/*.conf;

		location = /healthz {
			access_log off;
			# default_type, not add_header: add_header Content-Type would emit a
			# second Content-Type alongside the inherited default.
			default_type text/plain;
			return 200 "ok\n";
		}

		location /_app/immutable/ {
			# Own add_header block, so server-level headers are not inherited here;
			# re-assert nosniff for the static assets. CSP/framing are moot on
			# sub-resources (they govern the HTML document, not its assets).
			add_header Cache-Control "public, max-age=31536000, immutable";
			add_header X-Content-Type-Options "nosniff" always;
			try_files $uri =404;
		}

		location / {
			try_files $uri $uri/ /200.html;
		}
	}
}
