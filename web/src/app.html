<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Link preview. Static and brand-only: the /s/{id} shell is served to
		     crawlers without SSR, and secrets are E2E-encrypted + burn on open, so
		     no per-secret preview is possible or safe. A crawler fetching a link
		     never consumes it (burn happens only on the Open button's POST). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Flick" />
		<meta property="og:title" content="Flick — one-time encrypted secret" />
		<meta
			property="og:description"
			content="An end-to-end encrypted link that burns after a single open."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Flick — one-time encrypted secret" />
		<meta
			name="twitter:description"
			content="An end-to-end encrypted link that burns after a single open."
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Tailwind 4 needs @property and color-mix (Safari 16.4+, Chrome 111+,
		     Firefox 128+). Older browsers, often an outdated iOS in-app browser, get
		     a half-styled page whose Open button may never enable. This plain ES5
		     check runs before the app and says so plainly, while the page underneath
		     stays usable where it still works. The check opens or consumes nothing. -->
		<script>
			(() => {
				var supported =
					typeof window.CSSPropertyRule !== 'undefined' &&
					window.CSS &&
					CSS.supports('color', 'color-mix(in srgb, red, blue)');
				if (supported) { return; }
				var notice = document.createElement('p');
				notice.setAttribute('role', 'alert');
				notice.style.cssText =
					'margin:0;padding:12px 16px;background:#fff4d6;color:#3d2c00;font:15px/1.5 system-ui,sans-serif;border-bottom:1px solid #d9b44a';
				notice.textContent =
					'This browser is too old for Flick. Before opening a secret, update it, or open this link in a current Safari, Chrome, Edge, or Firefox. A secret can be opened only once.';
				document.body.insertBefore(notice, document.body.firstChild);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
